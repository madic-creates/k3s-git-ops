---
# SnapOtter PostgreSQL network policy: only the app may connect
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: snapotter-postgres
  namespace: snapotter
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: snapotter-postgres
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:app.kubernetes.io/name: snapotter
            k8s:io.kubernetes.pod.namespace: snapotter
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
  egress:
    # Allow DNS resolution via CoreDNS
    - toEndpoints:
        - matchLabels:
            k8s:io.cilium.k8s.namespace.labels.kubernetes.io/metadata.name: kube-system
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
