---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: 13-pihole03
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # One wave after 12-pihole-helm: when the parent syncs Application changes
    # (chart source, version), it waits until pihole-01 is Healthy before
    # touching pihole-03. Values-only commits are synced by each child app on
    # its own, so a commit changing both values files still restarts both.
    argocd.argoproj.io/sync-wave: "52"
spec:
  project: default
  sources:
    # Tracks the upstream main branch on purpose (pihole-01 stays on a release)
    - repoURL: https://github.com/MoJo2600/pihole-kubernetes.git
      targetRevision: main
      path: charts/pihole
      helm:
        releaseName: pihole-03
        valueFiles:
          - $values/apps/pihole-03/helm-values.enc.yaml
    - repoURL: "example.com"
      targetRevision: HEAD
      ref: values
  destination:
    server: "https://kubernetes.default.svc"
    namespace: dns
  syncPolicy:
    syncOptions:
      - ApplyOutOfSyncOnly=true
    automated:
      prune: true
      selfHeal: true
