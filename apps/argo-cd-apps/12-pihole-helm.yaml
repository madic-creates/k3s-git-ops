---
# All Pi-hole releases in one Application, so a single sync handles them in
# order: pihole-01's Deployment is wave 0, pihole-03's wave 1 and pihole-02's
# wave 2 (deploymentAnnotations in their helm-values.enc.yaml). ArgoCD only
# rolls the next one once the previous is Healthy, also for values-only commits.
# The values source also renders apps/pihole-01 (namespace, nebula-sync,
# dhcphelpers, PDB) with its own per-resource waves (-2, -1, 3).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: 12-pihole-helm
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "51"
spec:
  project: default
  sources:
    # pihole-01: published chart release
    - repoURL: https://mojo2600.github.io/pihole-kubernetes/
      chart: pihole
      targetRevision: 3.0.0-rc.3
      helm:
        releaseName: pihole
        valueFiles:
          - $values/apps/pihole-01/helm-values.enc.yaml
    # pihole-03: tracks the upstream main branch on purpose
    - repoURL: https://github.com/MoJo2600/pihole-kubernetes.git
      targetRevision: main
      path: charts/pihole
      helm:
        releaseName: pihole-03
        valueFiles:
          - $values/apps/pihole-03/helm-values.enc.yaml
    # $values for all releases, and renders apps/pihole-01 (path). Stays at
    # index 2: the repoURL replacement in kustomization.yaml targets it.
    - repoURL: "example.com"
      targetRevision: HEAD
      ref: values
      path: apps/pihole-01
    # pihole-02: standby for pihole-01, so the same chart version as pihole-01
    - repoURL: https://mojo2600.github.io/pihole-kubernetes/
      chart: pihole
      targetRevision: 3.0.0-rc.3
      helm:
        releaseName: pihole-02
        valueFiles:
          - $values/apps/pihole-02/helm-values.enc.yaml
  destination:
    server: "https://kubernetes.default.svc"
    namespace: dns
  # The DHCP relays are switched by scaling them (kubectl scale), not by a
  # commit, see apps/pihole-01/k8s.dhcprelay.yaml. ArgoCD must neither show
  # that as drift nor revert it.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: dhcphelper
      jsonPointers:
        - /spec/replicas
    - group: apps
      kind: Deployment
      name: dhcphelper-02
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
    automated:
      prune: true
      selfHeal: true
