---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: 12-pihole-helm
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "51"
spec:
  project: default
  sources:
    - repoURL: https://mojo2600.github.io/pihole-kubernetes/
      chart: pihole
      targetRevision: 3.0.0-rc.2
      helm:
        releaseName: pihole
        valueFiles:
          - $values/apps/pihole-01/helm-values.enc.yaml
    - repoURL: "example.com"
      targetRevision: HEAD
      ref: values
  destination:
    server: "https://kubernetes.default.svc"
    namespace: dns
  syncPolicy:
    syncOptions:
      - ApplyOutOfSyncOnly=true
    automated:
      prune: true
      selfHeal: true
