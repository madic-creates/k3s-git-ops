---
resources:
  - namespace.yaml
  - k8s.np.media-default-deny.yaml
  - smb-media.yaml
  - longhorn-media.yaml
  - autorestart.yaml
  - k8s.np.emby.yaml
  - k8s.np.restart-deployment.yaml
  - k8s.cronjob-ldap-cert-update.yaml
  - k8s.rbac-ldap-cert-update.yaml
  - k8s.np.ldap-cert-update.yaml
  - k8s.backup-cronjob.yaml
  - k8s.service-emby-tunnel.yaml

namespace: media

commonAnnotations:
  argocd.argoproj.io/sync-wave: "30"

helmCharts:
  - name: emby
    repo: https://k8s-at-home.com/charts/
    version: 3.4.2
    releaseName: emby
    namespace: media
    includeCRDs: true
    valuesInline:
      controller:
        replicas: 1
      serviceAccount:
        create: true
      env:
        TZ: Europe/Berlin
        UID: "0"
        GID: "0"
      image:
        repository: emby/embyserver
        tag: 4.11.0.6
        pullPolicy: IfNotPresent
      resources:
        requests:
          gpu.intel.com/i915: 1
          memory: "4Gi"
          cpu: "1"
        limits:
          gpu.intel.com/i915: 1
          memory: "12Gi"
          # Units in mCPU. 6000m ~ 6 CPU
          cpu: "6000m"
      strategy:
        type: Recreate
      service:
        main:
          type: LoadBalancer
          annotations:
            lbipam.cilium.io/ips: 192.168.1.233
          # LAN clients reach Emby through this VIP. With Local, kube-vip
          # (svc_election) moves the VIP to the node hosting the pod, so Emby sees
          # the real client IP. Clients behind the vps08 WireGuard tunnel use the
          # NodePorts of the separate emby-tunnel Service instead
          # (k8s.service-emby-tunnel.yaml). See docs/loadbalancer.md.
          externalTrafficPolicy: Local
      persistence:
        config:
          enabled: true
          mountPath: /config
          existingClaim: longhorn-pvc-emby
          retain: true
        video:
          enabled: true
          mountPath: /vol_raidz1/video
          existingClaim: smb-pvc-video
          retain: true
        music:
          enabled: true
          mountPath: /vol_raidz1/music
          existingClaim: smb-pvc-music
          retain: true
        photo:
          enabled: true
          mountPath: /vol_raidz1/photo
          existingClaim: smb-pvc-photo
          retain: true
        emby-certificate-secret:
          enabled: true
          name: emby-certificate-pkcs12
          type: secret
          item: keystore.p12
          mountPath: /etc/ssl/certs/certificate
          readOnly: true
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values:
                      - argocd-application-controller
                      - jellyfin
                      - nextpvr
              topologyKey: "kubernetes.io/hostname"

patches:
  # Disable auto-mount of service account token
  - target:
      version: v1
      kind: ServiceAccount
      name: emby
    patch: |-
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: emby
      automountServiceAccountToken: false
  # Release the NodePorts of the LoadBalancer Service. 32606/31961 belong to
  # the emby-tunnel Service, which syncs one wave later, after they are freed.
  - target:
      version: v1
      kind: Service
      name: emby
    patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: emby
      spec:
        allocateLoadBalancerNodePorts: false
  # Disable service account token mount on the Deployment.
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: emby
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: emby
        namespace: media
      spec:
        template:
          spec:
            automountServiceAccountToken: false

# Sync emby-tunnel one wave after the emby Service, which first has to free
# NodePorts 32606/31961. A transformer, because it runs after commonAnnotations,
# which would otherwise reset the wave to 30.
transformers:
  - k8s.transformer-emby-tunnel-sync-wave.yaml

generators:
  - kustomize-secret-generator.yaml
