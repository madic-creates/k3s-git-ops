---
# Network policy for the Open-Meteo irradiance exporter.
#
# This is the FIRST internet-dependent source in the energy stack. Every other
# one -- the inverter's logger stick, the FRITZ!Box -- is LAN-local and reached
# via toCIDR. This pod needs egress to a public API instead.
#
# The policy selects only this exporter, so the DNS handling below cannot
# affect deye-inverter-mqtt or mqtt2prometheus, which keep the plain port-53
# rule they have in k8s.np.solar.yaml.
#
# NOTE ON toFQDNs: Cilium can only enforce a toFQDNs rule when the DNS request
# passes through its DNS proxy, which requires the `rules.dns` block on the
# port-53 egress below. This cluster has `enable-l7-proxy: true`, so that
# works -- verified in the pod, the name resolves and egress succeeds.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: openmeteo-exporter
  namespace: solar
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: openmeteo-exporter
  ingress:
  # Allow Prometheus to scrape metrics
  - fromEndpoints:
    - matchLabels:
        k8s:app.kubernetes.io/name: prometheus
        k8s:io.kubernetes.pod.namespace: monitoring
    toPorts:
    - ports:
      - port: "9779"
        protocol: TCP
  egress:
  # Allow DNS resolution via CoreDNS, through Cilium's DNS proxy so that the
  # toFQDNs rule below can learn the resolved address.
  - toEndpoints:
    - matchLabels:
        k8s:io.cilium.k8s.namespace.labels.kubernetes.io/metadata.name: kube-system
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s:k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "53"
        protocol: TCP
      rules:
        dns:
          # Deliberately "*" and not `matchName: api.open-meteo.com`.
          #
          # The pod's resolv.conf carries `ndots:5` and three search domains.
          # A name with fewer than five dots is tried against every search
          # domain FIRST, so resolving api.open-meteo.com actually asks for
          #   api.open-meteo.com.solar.svc.cluster.local
          #   api.open-meteo.com.svc.cluster.local
          #   api.open-meteo.com.cluster.local
          # before the real name. With a narrow matchName those three are
          # answered REFUSED by the DNS proxy (see
          # tofqdns-dns-reject-response-code in cilium-config), and musl -- the
          # resolver in the Alpine image -- treats REFUSED as fatal and returns
          # EAI_AGAIN instead of moving on to the next candidate. The exporter
          # then never resolved anything: "[Errno -3] Try again".
          #
          # Permitting the proxy to answer any query is not the same as
          # permitting egress: resolution is not connectivity. Which addresses
          # this pod may actually reach is still decided by the toFQDNs rule
          # below plus the namespace default-deny, so egress stays limited to
          # api.open-meteo.com on 443.
          - matchPattern: "*"
  # Allow HTTPS to the Open-Meteo API only
  - toFQDNs:
    - matchName: api.open-meteo.com
    toPorts:
    - ports:
      - port: "443"
        protocol: TCP
