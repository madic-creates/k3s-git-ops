---
# Bridges the per-topic MQTT values published by deye-inverter-mqtt into a
# Prometheus /metrics endpoint. Its configuration lives in
# mqtt2prometheus.config.yaml and is turned into a hashed ConfigMap by the
# configMapGenerator in kustomization.yaml, so editing it rolls this pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mqtt2prometheus
  namespace: solar
  labels:
    app.kubernetes.io/name: mqtt2prometheus
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: mqtt2prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mqtt2prometheus
    spec:
      containers:
        - name: mqtt2prometheus
          image: ghcr.io/hikhvar/mqtt2prometheus:v0.1.7
          args:
            - -config
            - /etc/mqtt2prometheus/config.yaml
            - -listen-port
            - "9641"
          ports:
            - containerPort: 9641
              name: metrics
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/mqtt2prometheus
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: mqtt2prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: mqtt2prometheus
  namespace: solar
  labels:
    app.kubernetes.io/name: mqtt2prometheus
spec:
  type: ClusterIP
  ports:
    - port: 9641
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    app.kubernetes.io/name: mqtt2prometheus
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: mqtt2prometheus
  namespace: solar
  labels:
    app.kubernetes.io/name: mqtt2prometheus
spec:
  endpoints:
    - interval: 30s
      path: /metrics
      port: metrics
      scheme: http
  namespaceSelector:
    matchNames:
      - solar
  selector:
    matchLabels:
      app.kubernetes.io/name: mqtt2prometheus
