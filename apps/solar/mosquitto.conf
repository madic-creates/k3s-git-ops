# MQTT broker used only as the transport between deye-inverter-mqtt (producer)
# and mqtt2prometheus (consumer). It is never exposed outside the namespace,
# so anonymous access is acceptable here: the CiliumNetworkPolicy in
# k8s.np.solar.yaml is what restricts who may connect, not broker-level auth.
# No persistence — every value is republished on the next poll cycle, so a
# restart loses nothing that matters.

listener 1883
allow_anonymous true
persistence false
log_dest stdout
