---
# MQTT broker used only as the transport between deye-inverter-mqtt (producer)
# and mqtt2prometheus (consumer). It is never exposed outside the namespace,
# so anonymous access is acceptable here: the CiliumNetworkPolicy in
# k8s.np.solar.yaml is what restricts who may connect, not broker-level auth.
# No persistence — every value is republished on the next poll cycle, so a
# restart loses nothing that matters.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto-config
  namespace: solar
data:
  mosquitto.conf: |
    listener 1883
    allow_anonymous true
    persistence false
    log_dest stdout
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
  namespace: solar
  labels:
    app.kubernetes.io/name: mosquitto
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: mosquitto
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mosquitto
    spec:
      # Start directly as the image's mosquitto user (uid/gid 1883, per the
      # upstream Dockerfile). Started as root, the broker tries to drop
      # privileges itself and dies with "Error setting groups whilst dropping
      # privileges" because `capabilities: drop: ALL` takes CAP_SETGID away.
      # Running as that user from the start means there is nothing to drop.
      securityContext:
        runAsUser: 1883
        runAsGroup: 1883
        runAsNonRoot: true
      containers:
        - name: mosquitto
          image: eclipse-mosquitto:2.0.22
          ports:
            - containerPort: 1883
              name: mqtt
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /mosquitto/config/mosquitto.conf
              subPath: mosquitto.conf
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            tcpSocket:
              port: mqtt
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: mosquitto-config
---
apiVersion: v1
kind: Service
metadata:
  name: mosquitto
  namespace: solar
  labels:
    app.kubernetes.io/name: mosquitto
spec:
  type: ClusterIP
  ports:
    - port: 1883
      targetPort: mqtt
      protocol: TCP
      name: mqtt
  selector:
    app.kubernetes.io/name: mosquitto
