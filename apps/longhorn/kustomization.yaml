---
helmCharts:
  - name: longhorn
    repo: https://charts.longhorn.io
    version: 1.13.0
    releaseName: longhorn
    namespace: longhorn
    valuesInline:
      # Longhorn's own backup target is disabled: volume backups are done by the
      # restic backup fleet (apps/backup-script), the Longhorn "backup"
      # RecurringJob is commented out, and the old Wasabi credentials were
      # revoked. With a dead S3 target, longhorn-manager 1.9 re-ran
      # `longhorn backup ls` in a tight loop (each failure writes a fresh error
      # message into the BackupTarget status, which re-triggers the reconcile),
      # burning 100-200% CPU on node01.
      # Since chart 1.8 the target is set via defaultBackupStore, not
      # defaultSettings. Empty strings (not null) are required: the chart only
      # renders keys that are set, and longhorn-manager only clears fields
      # whose key is present in the longhorn-default-resource ConfigMap.
      defaultBackupStore:
        backupTarget: ""
        backupTargetCredentialSecret: ""
      defaultSettings:
        orphanAutoDeletion: true
        removeSnapshotsDuringFilesystemTrim: true
        nodeDownPodDeletionPolicy: delete-both-statefulset-and-deployment-pod
      longhornUI:
        replicas: 1
      longhornConversionWebhook:
        replicas: 1
      longhornAdmissionWebhook:
        replicas: 1
      longhornRecoveryBackend:
        replicas: 1
      persistence:
        reclaimPolicy: Retain
      preUpgradeChecker:
        jobEnabled: false

resources:
  - namespace.yaml

commonAnnotations:
  argocd.argoproj.io/sync-wave: "15"

patches:
  - target:
      version: v1
      kind: ConfigMap
      name: longhorn-storageclass
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: longhorn-storageclass
        annotations:
          storageclass.kubernetes.io/is-default-class: "true"
  - target:
      version: v1
      kind: DaemonSet
      name: longhorn-manager
    patch: |-
      apiVersion: apps/v1
      kind: DaemonSet
      metadata:
        name: longhorn-manager
      spec:
        revisionHistoryLimit: 2
  - target:
      version: v1
      kind: Deployment
      name: longhorn-driver-deployer
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: longhorn-driver-deployer
      spec:
        revisionHistoryLimit: 2
  - target:
      version: v1
      kind: Deployment
      name: longhorn-ui
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: longhorn-ui
      spec:
        revisionHistoryLimit: 2

generators:
  - kustomize-secret-generator.yaml
