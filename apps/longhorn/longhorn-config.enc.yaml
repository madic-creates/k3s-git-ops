# HTTPS Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    name: longhorn
    namespace: longhorn
    annotations:
        # HTTPS as entry point
        traefik.ingress.kubernetes.io/router.entrypoints: web239, websecure239
        # Enable TLS
        traefik.ingress.kubernetes.io/router.tls: "true"
        # Use Basic Auth Midleware configured
        traefik.ingress.kubernetes.io/router.middlewares: longhorn-svc-longhorn-headers@kubernetescrd, authelia-forwardauth-authelia@kubernetescrd
        # Enable cert-manager to create automatically the SSL certificate and store in Secret
        #cert-manager.io/cluster-issuer: netcup-issuer-staging
        #cert-manager.io/cluster-issuer: ca-issuer
spec:
    tls:
        - hosts:
            - ENC[AES256_GCM,data:pYqwn3WZ/iswkD+ZNMhJsSAASBCmQypCQvpL9YQ=,iv:+D/KgbtlRAmZVd2QIHcPDGfOCykgyGPCiMbP0eNfvxk=,tag:uraAL6FOF4DknzsG9x2Xmg==,type:str]
          secretName: wildcard-cloudflare-production-02
    rules:
        - host: ENC[AES256_GCM,data:J+1+siM5KrGVrsmS2b/kbJuYlcAtlHl7lFZolPY=,iv:E8xnsd2JCxu8/EoSZhpCxoxqVZ0e1VkG3HaajMvExbM=,tag:NYwT9xDbLcBN0q6rMggh8g==,type:str]
          http:
            paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                        name: longhorn-frontend
                        port:
                            number: 80
