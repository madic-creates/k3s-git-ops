kind: CiliumNetworkPolicy
metadata:
  name: longhorn-csi-plugin
  namespace: longhorn
  annotations:
    argocd.argoproj.io/sync-wave: "15"
spec:
  endpointSelector:
    matchLabels:
      app: longhorn-csi-plugin
  ingress:
  # Allow access from kube-system (kubelet)
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
  # Allow access from longhorn components
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: longhorn
  # Allow access from host networking (kubelet, metrics scraping)
  - fromEntities:
    - host
  egress:
  # Allow DNS resolution via CoreDNS
  - toEndpoints:
    - matchLabels:
        k8s:io.cilium.k8s.namespace.labels.kubernetes.io/metadata.name: kube-system
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s:k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "53"
        protocol: TCP
  # Allow access to Kubernetes API server
  - toEntities:
    - kube-apiserver
  # Allow communication with longhorn components
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: longhorn
