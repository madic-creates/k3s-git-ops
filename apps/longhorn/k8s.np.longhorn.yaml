---
# Network Policy for Longhorn UI
# The Longhorn UI provides the web interface for managing Longhorn storage.
# It needs to receive traffic from Traefik ingress controller.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: longhorn-ui
  namespace: longhorn
  annotations:
    argocd.argoproj.io/sync-wave: "15"
spec:
  endpointSelector:
    matchLabels:
      app: longhorn-ui
  ingress:
  # Allow Traefik to reach Longhorn UI
  - fromEndpoints:
    - matchLabels:
        k8s:app.kubernetes.io/instance: traefik-kube-system
        k8s:io.kubernetes.pod.namespace: kube-system
    toPorts:
    - ports:
      - port: "8000"
        protocol: TCP
  # Allow internal communication from longhorn-manager
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: longhorn
  egress:
  # Allow DNS resolution via CoreDNS
  - toEndpoints:
    - matchLabels:
        k8s:io.cilium.k8s.namespace.labels.kubernetes.io/metadata.name: kube-system
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s:k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "53"
        protocol: TCP
  # Allow access to longhorn-frontend service
  - toEndpoints:
    - matchLabels:
        k8s:app: longhorn-manager
        k8s:io.kubernetes.pod.namespace: longhorn
    toPorts:
    - ports:
      - port: "9500"
        protocol: TCP
  # Allow communication with other longhorn components
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: longhorn
---
# Network Policy for Longhorn Manager
# The Longhorn Manager is a DaemonSet that runs on each node and manages
# the Longhorn storage system. It needs extensive access to:
# - Kubernetes API server
# - Other longhorn-manager instances
# - Instance managers, engine images, CSI components
# - External S3/Wasabi for backups
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: longhorn-manager
  namespace: longhorn
  annotations:
    argocd.argoproj.io/sync-wave: "15"
spec:
  endpointSelector:
    matchLabels:
      app: longhorn-manager
  ingress:
  # Allow access from other longhorn components
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: longhorn
  # Allow access from kube-system (kubelet, kube-apiserver)
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
  # Allow access from host networking (kubelet health checks)
  - fromEntities:
    - host
  egress:
  # Allow DNS resolution via CoreDNS
  - toEndpoints:
    - matchLabels:
        k8s:io.cilium.k8s.namespace.labels.kubernetes.io/metadata.name: kube-system
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s:k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "53"
        protocol: TCP
  # Allow access to Kubernetes API server
  - toEntities:
    - kube-apiserver
  # Allow communication with all longhorn components in the same namespace
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: longhorn
  # Allow external access for S3/Wasabi backups
  - toEntities:
    - world
    toPorts:
    - ports:
      - port: "443"
        protocol: TCP
      - port: "80"
        protocol: TCP
---
# Network Policy for Longhorn CSI Plugin
# The CSI plugin runs as a DaemonSet on each node and handles
# volume operations. It needs to communicate with:
# - Instance managers
# - Longhorn manager
# - Kubernetes API
