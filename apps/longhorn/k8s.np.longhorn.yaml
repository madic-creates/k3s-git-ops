---
# Network Policy for Share Manager
# Share managers provide NFS access to Longhorn volumes.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: share-manager
  namespace: longhorn
  annotations:
    argocd.argoproj.io/sync-wave: "15"
spec:
  endpointSelector:
    matchExpressions:
    - key: app
      operator: In
      values:
      - share-manager
  ingress:
  # Allow NFS access from any pod that needs to mount the volume
  - fromEndpoints:
    - {}
  # Allow access from longhorn-manager
  - fromEndpoints:
    - matchLabels:
        k8s:app: longhorn-manager
        k8s:io.kubernetes.pod.namespace: longhorn
  egress:
  # Allow DNS resolution via CoreDNS
  - toEndpoints:
    - matchLabels:
        k8s:io.cilium.k8s.namespace.labels.kubernetes.io/metadata.name: kube-system
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s:k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "53"
        protocol: TCP
  # Allow communication with instance managers
  - toEndpoints:
    - matchLabels:
        k8s:longhorn.io/component: instance-manager
        k8s:io.kubernetes.pod.namespace: longhorn
---
# Network Policy for VersityGW (S3 Gateway)
# VersityGW provides S3-compatible API access to Longhorn volumes.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: versitygw
  namespace: longhorn
  annotations:
    argocd.argoproj.io/sync-wave: "16"
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: versitygw
  ingress:
  # Allow Traefik to reach VersityGW
  - fromEndpoints:
    - matchLabels:
        k8s:app.kubernetes.io/instance: traefik-kube-system
        k8s:io.kubernetes.pod.namespace: kube-system
    toPorts:
    - ports:
      - port: "7070"
        protocol: TCP
  # Allow access from any pod that needs S3 access
  - fromEndpoints:
    - {}
  egress:
  # Allow DNS resolution via CoreDNS
  - toEndpoints:
    - matchLabels:
        k8s:io.cilium.k8s.namespace.labels.kubernetes.io/metadata.name: kube-system
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s:k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "53"
        protocol: TCP
  # Allow access to instance managers for volume data
  - toEndpoints:
    - matchLabels:
        k8s:longhorn.io/component: instance-manager
        k8s:io.kubernetes.pod.namespace: longhorn
  # Allow access to share managers
  - toEndpoints:
    - matchExpressions:
      - key: k8s:app
        operator: In
        values:
        - share-manager
      k8s:io.kubernetes.pod.namespace: longhorn
