---
# Network Policy for Instance Managers
# Instance managers run on each node and manage volume engine and replica processes.
# They need to communicate with each other for replication and with longhorn-manager.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: instance-manager
  namespace: longhorn
  annotations:
    argocd.argoproj.io/sync-wave: "15"
spec:
  endpointSelector:
    matchLabels:
      longhorn.io/component: instance-manager
  ingress:
  # Allow access from other instance managers for volume replication
  - fromEndpoints:
    - matchLabels:
        k8s:longhorn.io/component: instance-manager
        k8s:io.kubernetes.pod.namespace: longhorn
  # Allow access from longhorn-manager and CSI components
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: longhorn
  # Allow access from host networking (iSCSI, metrics)
  - fromEntities:
    - host
  # Allow access from all pods that may mount volumes
  - fromEndpoints:
    - {}
  egress:
  # Allow DNS resolution via CoreDNS
  - toEndpoints:
    - matchLabels:
        k8s:io.cilium.k8s.namespace.labels.kubernetes.io/metadata.name: kube-system
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s:k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "53"
        protocol: TCP
  # Allow access to Kubernetes API server
  - toEntities:
    - kube-apiserver
  # Allow communication with other instance managers
  - toEndpoints:
    - matchLabels:
        k8s:longhorn.io/component: instance-manager
        k8s:io.kubernetes.pod.namespace: longhorn
  # Allow communication with longhorn-manager
  - toEndpoints:
    - matchLabels:
        k8s:app: longhorn-manager
        k8s:io.kubernetes.pod.namespace: longhorn
