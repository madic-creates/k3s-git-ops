---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-cpp-qwen3.6-35b-a3b
  namespace: llama-cpp
  labels:
    app: llama-cpp
    model: qwen3.6-35b-a3b
spec:
  # Starts at 0 so the GPU stays available to the qwen2.5-coder Deployment by
  # default. Switch on demand with `kubectl scale`; replicas is ignored by
  # ArgoCD (see apps/argo-cd-apps/65-llama-cpp.yaml) so no git sync is needed:
  #   kubectl -n llama-cpp scale deploy/llama-cpp-qwen2.5-coder   --replicas=0
  #   kubectl -n llama-cpp scale deploy/llama-cpp-qwen3.6-35b-a3b --replicas=1
  # Qwen3.6-35B-A3B is a MoE (35B total, 3B active) agentic coding model. The
  # UD-Q3_K_XL GGUF (~16.8 GB) does not fit the 8 GB GPU, so llama.cpp keeps
  # attention, shared weights and KV cache on the GPU and part of the expert
  # weights in system RAM (~10-12 GB on node04).
  replicas: 0
  revisionHistoryLimit: 2
  strategy:
    # Single-tenant GPU; rolling would deadlock on nvidia.com/gpu.
    type: Recreate
  selector:
    matchLabels:
      app: llama-cpp
      model: qwen3.6-35b-a3b
  template:
    metadata:
      labels:
        app: llama-cpp
        model: qwen3.6-35b-a3b
    spec:
      runtimeClassName: nvidia
      nodeSelector:
        node-role/workload: zfs
      initContainers:
        # Fail fast with a clear error if the operator forgot to stage the
        # GGUF, or if the file got truncated. Cheaper than a CrashLoop on the
        # main container, which buries the cause in llama.cpp logs.
        # SHA256 pinned from huggingface.co/unsloth/Qwen3.6-35B-A3B-GGUF
        # (Qwen3.6-35B-A3B-UD-Q3_K_XL.gguf).
        - name: verify-model
          image: alpine:3.24@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
          command:
            - sh
            - -c
            - |
              set -eu
              MODEL=/models/Qwen3.6-35B-A3B-UD-Q3_K_XL.gguf
              EXPECTED_SHA256=a832b9689925f1bd335bbe985cdfb06c36bf2cf268f4f8f6eceafa3ceb515617
              test -f "$MODEL" || { echo "model file missing: $MODEL"; exit 1; }
              # GGUF magic number is the ASCII string "GGUF" at offset 0
              head -c4 "$MODEL" | grep -q '^GGUF' || {
                echo "not a GGUF file (header mismatch)"; exit 1; }
              echo "$EXPECTED_SHA256  $MODEL" | sha256sum -c -
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
      containers:
        - name: llama-cpp
          image: ghcr.io/ggml-org/llama.cpp:server-cuda@sha256:334ddc356f5ad08dbf7eb6c98d1739a72e15b5cf452d1aeeae740c6625eb1226
          args:
            - --model
            - /models/Qwen3.6-35B-A3B-UD-Q3_K_XL.gguf
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            # --n-gpu-layers and --n-cpu-moe are intentionally unset: --fit
            # (default on) places as many expert layers on the GPU as fit while
            # keeping a 1 GiB VRAM margin, and moves the rest to system RAM.
            # Only 10 of 40 layers use full attention (the rest are Gated
            # DeltaNet), so the KV cache stays small even at 64k context.
            - --ctx-size
            - "65536"
            - --cache-type-k
            - q8_0
            - --cache-type-v
            - q8_0
            - --parallel
            - "1"
            - --flash-attn
            - "on"
            # Expert matmuls on the CPU are memory-bandwidth bound; one thread
            # per physical core (Ryzen 5 3600) avoids SMT contention.
            - --threads
            - "6"
            # Qwen's recommended sampling for thinking mode, precise coding.
            # Clients can still override per request.
            - --temp
            - "0.6"
            - --top-p
            - "0.95"
            - --top-k
            - "20"
            - --min-p
            - "0.0"
            - --api-key-file
            - /etc/llama-cpp/api-key
            - --alias
            - qwen3.6-35b-a3b
            - --jinja
          ports:
            - containerPort: 8080
              name: http
          resources:
            # Expert weights are mmap'd file pages and count against the
            # cgroup; they are reclaimable, so pressure degrades speed (re-reads
            # from ZFS) instead of triggering an OOM kill.
            requests:
              cpu: "4"
              memory: 12Gi
              nvidia.com/gpu: 1
            limits:
              cpu: "8"
              memory: 16Gi
              nvidia.com/gpu: 1
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
            - name: api-key
              mountPath: /etc/llama-cpp
              readOnly: true
          # Loading ~17 GB from vol_raidz1 plus --fit probing takes minutes;
          # hold off the liveness probe until the server is up.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            failureThreshold: 6
      volumes:
        - name: models
          hostPath:
            path: /vol_raidz1/downloads/llama-cpp/models
            type: Directory
        - name: api-key
          secret:
            secretName: llama-cpp-env
            defaultMode: 0400
            items:
              - key: API_KEY
                path: api-key
