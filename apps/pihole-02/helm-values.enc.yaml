# Standby for pihole-01: same rules, upstream and DHCP config, own IP (.234).
# Its own name label (like pihole-03) keeps it out of pihole-01's selectors.
nameOverride: pihole-02
image:
    repository: ghcr.io/pi-hole/pihole
    #tag: 2025.11.1
    pullPolicy: IfNotPresent
revisionHistoryLimit: 2
serviceDns:
    mixedService: true
    annotations:
        lbipam.cilium.io/ips: 192.168.1.234
        lbipam.cilium.io/sharing-key: pihole02dnsdhcp
    # type LoadBalancer with externalTrafficPolicy Local
    # requires 192.168.1.234 on the same node as the pod
    type: LoadBalancer
    #externalTrafficPolicy: Cluster
    #type: ClusterIP
serviceDhcp:
    # Standby: only dhcphelper-02 relays here, and it runs at 0 replicas until
    # pihole-01 fails (see apps/pihole-01/k8s.dhcprelay.yaml)
    enabled: true
    annotations:
        lbipam.cilium.io/ips: 192.168.1.234
        lbipam.cilium.io/sharing-key: pihole02dnsdhcp
    type: LoadBalancer
virtualHost: ENC[AES256_GCM,data:f89iAS1seT1T+bGCDXJ7ZGy79AbAbSfNjdG455CY,iv:skmtqv4mMEUH+9XVyullonlhvP2a0YPwGIttIanA9BM=,tag:thfg5BaJGSyzgX3RAx/FaQ==,type:str]
ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
        - ENC[AES256_GCM,data:raIqpH2aPgVk/xsuifyO/Vuew+TR+nDFpE17jjqO,iv:ZIWeTbUuOs/SB8PE3QejA+2bgCBH7mX2IRJvfDY2xv8=,tag:a/FeYq8tVIUm7NKRImUyWg==,type:str]
    tls:
        - secretName: wildcard-cloudflare-production-02
          hosts:
            - ENC[AES256_GCM,data:1PvE2CUPN5ttcaboLLFaxm7KU7/rSyfbtPFCZbJL,iv:ibt83EC45JJrcv9txOJbQkhu+UP41MzJd0tjG9Ebbec=,tag:Jm95DfW25LG6ij7jLgSZYg==,type:str]
    annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: web239, websecure239
        traefik.ingress.kubernetes.io/router.tls: "true"
        traefik.ingress.kubernetes.io/router.middlewares: authelia-forwardauth-authelia@kubernetescrd, traefik-root-to-admin@kubernetescrd
resources:
    limits:
        cpu: 1000m
        memory: 1024Mi
    requests:
        cpu: 100m
        memory: 128Mi
extraEnvVars:
    TZ: Europe/Berlin
    # The node clock is set by the host. Setting it from a pod would need
    # SYS_TIME, which is not namespaced and would change the whole node.
    FTLCONF_ntp_sync_active: false
    #FTLCONF_dns_dnssec: true
    FTLCONF_dns_bogusPriv: true
    FTLCONF_dns_domainNeeded: true
    FTLCONF_dhcp_start: 192.168.1.50
    FTLCONF_dhcp_end: 192.168.1.200
    FTLCONF_dhcp_router: 192.168.1.1
    FTLCONF_dhcp_leaseTime: 12d
    FTLCONF_dns_domain_name: neese-web.de
    FTLCONF_dhcp_rapidCommit: true
    FTLCONF_webserver_interface_boxed: false
    #FTLCONF_MOZILLA_CANARY: true
    #FTLCONF_BLOCK_ICLOUD_PR: true
DNS1: 127.0.0.1:5053
# Not required because secured via authelia oidc
admin:
    enabled: false
doh:
    enabled: true
    config: ENC[AES256_GCM,data:,iv:yYhba8LKxJJTMQScGjXKVp+lxpQEUkSI/w01FMB7MNc=,tag:G4UXXGiAVNWrrks9C2jkEA==,type:str]
