# Not required. We're running a dhcp relay via host network.
#hostNetwork: "true"
# capabilities is deprecated in the chart; containerSecurityContext replaces it
containerSecurityContext:
    privileged: false
    capabilities:
        add:
            - NET_ADMIN
            - SYS_NICE
persistentVolumeClaim:
    enabled: true
    size: 5Gi
    # helm.sh/resource-policy: keep, ArgoCD then leaves the PVC on app deletion
    keep: true
podDnsConfig:
    enabled: true
    policy: None
    nameservers:
        - 1.1.1.1
        - 127.0.0.1
# Never on the same node as pihole-01 (a node failure must not take both) or
# pihole-03. Three Pi-holes on four nodes still fit with one node down.
affinity:
    podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - pihole
                        - pihole-03
              topologyKey: kubernetes.io/hostname
# Reschedule faster on ungraceful node failure. Together with Longhorn's
# nodeDownPodDeletionPolicy this lets the pod move off a dead node instead of
# waiting for the default 300s unreachable/not-ready toleration.
tolerations:
    - key: node.kubernetes.io/unreachable
      operator: Exists
      effect: NoExecute
      tolerationSeconds: 30
    - key: node.kubernetes.io/not-ready
      operator: Exists
      effect: NoExecute
      tolerationSeconds: 30
# Pod hostname = Service name: Pi-hole accepts its own hostname as Host
# header without a password, so nebula-sync can use http://pihole-02-web
hostname: ENC[AES256_GCM,data:CjhZFo1jr5gOsggtCg==,iv:9JbC2wU/dt3xlqA/kn3LdsochxoJgH8rjGAX20NdzOY=,tag:8hc9yf8w/8NLvu/mWqUFew==,type:str]
# Roll out only after pihole-01 (wave 0) and pihole-03 (wave 1) are Healthy,
# so at most one Pi-hole restarts at a time, see 12-pihole-helm
deploymentAnnotations:
    argocd.argoproj.io/sync-wave: "2"
# The API has no password (Authelia protects the UI), so only Traefik,
# nebula-sync and Prometheus (exporter port) may reach the web port.
# DNS and DHCP stay open to every source.
networkPolicy:
    enabled: true
    ingress:
        from:
            - namespaceSelector:
                matchLabels:
                    kubernetes.io/metadata.name: kube-system
              podSelector:
                matchLabels:
                    app.kubernetes.io/name: traefik
            - podSelector:
                matchLabels:
                    app: nebula-sync
            # Metrics: the chart puts the exporter port into the same rule as the web port
            - namespaceSelector:
                matchLabels:
                    kubernetes.io/metadata.name: monitoring
              podSelector:
                matchLabels:
                    app.kubernetes.io/name: prometheus
# pihole-exporter sidecar (talks to Pi-hole via the pod IP, no password needed)
# and a PodMonitor; Prometheus egress to dns:9617 is in apps/monitoring
monitoring:
    sidecar:
        enabled: true
    podMonitor:
        enabled: true
