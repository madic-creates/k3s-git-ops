# Self-monitor the blackbox-exporter (chart-internal /metrics).
serviceMonitor:
    selfMonitor:
        enabled: true
        interval: 60s
        scrapeTimeout: 10s
    # One ServiceMonitor per entry below. The chart turns each into a scrape
    # config that calls the blackbox-exporter Service with `?target=...&module=...`.
    # Target names are deliberately generic so the file stays committable —
    # the actual hostnames live in the SOPS-encrypted `url` / `hostname` fields.
    # Resolve names via `sops -d` when correlating with metrics.
    enabled: true
    defaults:
        interval: 3m
        scrapeTimeout: 10s
        module: http_2xx
    targets:
        # ----- HTTP(S) reachability + TLS cert checks, every 3 minutes -----
        # Module http_2xx follows redirects, accepts default 2xx, prefers IPv4.
        # For HTTPS URLs the http prober also performs the TLS handshake, so
        # probe_ssl_earliest_cert_expiry / probe_ssl_last_chain_expiry are
        # exported from the same scrape — no separate cert-only probe needed.
        - name: http-01
          url: ENC[AES256_GCM,data:CEGthn7p6rlvazhklAgJOyFnHeaE3P664g==,iv:SC6p6gRsLAPyvgzkxkc/0/Oh1x745dqq0LZtkgbLjz0=,tag:oJo+dTVpEtVSJjXufrK/dQ==,type:str]
        - name: http-02
          url: ENC[AES256_GCM,data:mf0OOW4GPCTIWhuv0wh5BAXce0JxiqHuMGa4,iv:z32BfpkiYT1Rg62m1Ak/qjU7Orug72hNLnvq7Lkhmd8=,tag:NZ599jFEDEJ9oxDe/1IKDA==,type:str]
        - name: http-03
          url: ENC[AES256_GCM,data:Ecew+K5Ib0L5+3nEQFV1kwI8HC/jinhP,iv:hyX4slqbXOJ6ie6hHF7xhuYNcFbJdJEY0MsmeNcLqOI=,tag:/sJo55P6a6dubYiFmxd8Pw==,type:str]
        - name: http-05
          url: ENC[AES256_GCM,data:4pPg9UFxZfk/5szOfbRhLmtyVkkbLLRj6ck=,iv:Jbe0isUhamwKG7U2CxwoLHTgVEIwpiphfoImkA4vyXQ=,tag:tIwzJyi/EZGIu89zn5m42g==,type:str]
        - name: http-06
          url: ENC[AES256_GCM,data:hb/moSf5qozfYj0V3OzMIn8NCuMFAgojvh0R,iv:z3rbxLPbP6Y/ZbO5cbWC5+x6PCyi/VHPKgqdnL/zwqI=,tag:juvcwCw6DHz2Lp7iockVvg==,type:str]
        - name: http-07
          url: ENC[AES256_GCM,data:7HtfOILeFQJ5HoZlv0YkkmCOUIFk1Ih/LWlffdepefaCZmC22aVdsQ==,iv:4XKzNTy6rIrIAlXnKLsX2+qBUKEd2LfSx9wTHGceLuI=,tag:t2CdtwM97f8mzn4gkR+chw==,type:str]
        # ----- Special case: wildcard cert probed against a fixed IP. -----
        # The chart's target-level `hostname` parameter is forwarded to the
        # blackbox-exporter as a query string and tells the http prober which
        # name to use for both the SNI and the Host header. That lets us
        # validate the wildcard cert against an IP without DNS, while the
        # ingress at that hostname returns 2xx so the standard http_2xx
        # module applies and dashboards need no special handling.
        - name: cert-special-01
          url: ENC[AES256_GCM,data:76L+sdVBEEm1OrS9QORTeD0jJilxKw==,iv:Wtvj54DLb7gKZE7yPXfY1L0W/6HUgtM0Kg4SCNGEReo=,tag:kMznzeL4SdcrqIMRl0eeRg==,type:str]
          hostname: ENC[AES256_GCM,data:uR4UA8ic2gKpc5XMuVQKT32sAxUn,iv:FYKRXNaUMzczNzhjruIkLmnxt0iVyFVOuFMmDP4wgSs=,tag:lqd+hJGmDJDtRVKzHpdoYA==,type:str]
# Probe modules.
config:
    modules:
        http_2xx:
            prober: http
            timeout: 5s
            http:
                valid_http_versions:
                    - HTTP/1.1
                    - HTTP/2.0
                follow_redirects: true
                preferred_ip_protocol: ip4
        http_post_2xx:
            prober: http
            timeout: 5s
            http:
                method: POST
        tcp_connect:
            prober: tcp
            timeout: 5s
        icmp:
            prober: icmp
            timeout: 5s
            icmp:
                preferred_ip_protocol: ip4
        # TLS handshake against the dialled hostname; SNI defaults to that hostname.
        tcp_connect_tls:
            prober: tcp
            timeout: 10s
            tcp:
                tls: true
                preferred_ip_protocol: ip4
resources:
    requests:
        cpu: 25m
        memory: 32Mi
    limits:
        memory: 128Mi
