---
commonAnnotations:
  argocd.argoproj.io/sync-wave: "31"

resources:
  - k8s.deployment.yaml
  - k8s.np.navidrome.yaml
  - k8s.service.yaml
  - k8s.dztnr.yaml
  # Test instance for the search5/navidrome fork branch
  # feat-podcast-ux-improvements/5420. Remove these three lines together with
  # ingress-test.enc.yaml in the ksops generator (and the dztnr-test CronJob
  # in k8s.dztnr.yaml) to tear it down.
  - k8s.test.deployment.yaml
  - k8s.np.navidrome-test.yaml
  - k8s.test.service.yaml

configMapGenerator:
  # Retry wrapper for the dztnr jobs, mounted as sitecustomize.py. No hash
  # suffix: kustomize does not rewrite configMap volume names inside a
  # CronJob's jobTemplate, and every job run starts a fresh pod anyway.
  - name: dztnr-retry
    files:
      - sitecustomize.py=dztnr-retry.py
    options:
      disableNameSuffixHash: true

generators:
  - kustomize-secret-generator.yaml
