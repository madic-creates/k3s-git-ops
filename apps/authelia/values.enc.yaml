##
pod:
    kind: Deployment
    revisionHistoryLimit: 2
    replicas: 2
    resources:
        requests:
            cpu: 50m
            memory: 96Mi
ingress:
    enabled: true
    className: traefik
    annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        traefik.ingress.kubernetes.io/router.tls: "true"
    certManager: false
    traefikCRD:
        enabled: true
        disableIngressRoute: true
        middlewares:
            auth:
                # Caps the ForwardAuth response body at 2 MiB (Traefik >= v3.6.9 option).
                enableMaxResponseBodySize: true
    tls:
        enabled: true
        secret: ENC[AES256_GCM,data:yDgvS3qnT9M3B2CIjRZGxEthf0ehljG6+zx9r5E1WRCX,iv:lXIoC6StJ5kJ++Go/X3gqzn20/Hj684SjMv8E45vLh0=,tag:C7770gkQNwt/XpWtCpLBtQ==,type:str]
configMap:
    #log:
    #    level: debug
    server:
        endpoints:
            authz:
                auth-request:
                    implementation: AuthRequest
                ext-authz:
                    implementation: ExtAuthz
                forward-auth:
                    implementation: ForwardAuth
                    authn_strategies:
                        - name: HeaderAuthorization
                          schemes:
                            - Basic
                          scheme_basic_cache_lifespan: 0
                        - name: CookieSession
                basic-forward-auth:
                    implementation: ForwardAuth
                    authn_strategies:
                        - name: HeaderAuthorization
                          schemes:
                            - Basic
                          scheme_basic_cache_lifespan: 0
