image:
    repository: ghcr.io/paperless-ngx/paperless-ngx
    tag: 3.5.1
env:
    - name: TZ
      value: Europe/Berlin
    - name: PAPERLESS_TIME_ZONE
      value: Europe/Berlin
    - name: PAPERLESS_REDIS
      value: redis://redis-master.databases.svc.cluster.local:6379/2
    - name: PAPERLESS_DBENGINE
      value: mariadb
    - name: PAPERLESS_DBHOST
      value: mariadb.databases.svc.cluster.local
    - name: PAPERLESS_DBPORT
      value: 3306
    - name: PAPERLESS_DBSSLMODE
      value: PREFERRED
    - name: PAPERLESS_FILENAME_FORMAT_REMOVE_NONE
      value: true
    # Trusts Remote-User from any peer. The frontend check only skips paths
    # containing "/api/", so a request to exactly /api still logs the header
    # user in with a persistent session that then works on the whole API.
    # The paperless-api Ingress has no forward auth and therefore must keep
    # the traefik-strip-remote-user middleware.
    - name: PAPERLESS_ENABLE_HTTP_REMOTE_USER
      value: true
    #- name: PAPERLESS_ENABLE_HTTP_REMOTE_USER_API
    #  value: true
    - name: PAPERLESS_OCR_LANGUAGE
      value: deu
    - name: PAPERLESS_OCR_MODE
      value: skip
    # Since 3.5.0 a set PAPERLESS_URL restricts ALLOWED_HOSTS to its hostname plus localhost.
    # Keep the in-cluster service name reachable (Homepage widget).
    - name: PAPERLESS_ALLOWED_HOSTS
      value: paperless.paper.svc.cluster.local
    # AI suggestions; backend settings are configured in the UI (Settings -> Configuration -> AI).
    - name: PAPERLESS_AI_ENABLED
      value: true
    # Disable Qwen3.5 thinking: otherwise each suggestion burns up to 8192 reasoning tokens
    # and can hit the 120s request timeout. Not configurable in the UI.
    - name: PAPERLESS_AI_LLM_EXTRA_PARAMS
      value: '{"extra_body":{"chat_template_kwargs":{"enable_thinking":false}}}'
    - name: PAPERLESS_USE_X_FORWARD_HOST
      value: true
    - name: PAPERLESS_USE_X_FORWARD_PORT
      value: true
    - name: PAPERLESS_CONSUMER_RECURSIVE
      value: true
    - name: PAPERLESS_CONSUMER_SUBDIRS_AS_TAGS
      value: true
    - name: PAPERLESS_CONSUMER_POLLING
      value: 300
    - name: PAPERLESS_CONSUMER_ENABLE_BARCODES
      value: true
    - name: PAPERLESS_CONSUMER_ENABLE_ASN_BARCODE
      value: true
    - name: PAPERLESS_OCR_DESKEW
      value: true
resources:
    requests:
        cpu: 100m
        memory: 1792Mi
persistentVolumeClaim:
    create: false
    storageClassName: longhorn
    existingPersistentVolumeClaim: smb-pvc-container-paperless-data
consumption:
    type: pvc
    persistentVolumeClaim:
        claimName: smb-pvc-documents
media:
    enabled: true
    type: pvc
    persistentVolumeClaim:
        claimName: smb-pvc-container-paperless-media
export:
    type: pvc
    persistentVolumeClaim:
        claimName: smb-pvc-container-paperless-export
trash:
    enabled: true
    type: pvc
    persistentVolumeClaim:
        claimName: smb-pvc-container-paperless-trash
