---
# Keep at least two of the three Pi-holes running during voluntary disruptions
# (node drains, e.g. by system-upgrade-controller), so pihole-01 and its
# standby pihole-02 are never evicted together. Spans all Helm releases, which
# carry different app.kubernetes.io/name labels (pihole-02 and pihole-03 use
# nameOverride). One PDB only: the eviction API refuses pods covered by more
# than one. The chart's own pdb.yaml only covers a single release, which with
# one replica would block every drain.
# Note: while one Pi-hole is down, drains of the other Pi-holes' nodes wait.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pihole-any
  namespace: dns
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  minAvailable: 2
  selector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [pihole, pihole-02, pihole-03]
