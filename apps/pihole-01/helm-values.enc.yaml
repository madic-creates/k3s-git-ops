# Not required. We're running a dhcp relay via host network.
#hostNetwork: "true"
# capabilities is deprecated in the chart; containerSecurityContext replaces it
containerSecurityContext:
    privileged: false
    capabilities:
        add:
            - NET_ADMIN
            - SYS_NICE
persistentVolumeClaim:
    enabled: true
    existingClaim: pihole
    #storageClass: longhorn
    #size: "10737418240"
podDnsConfig:
    enabled: true
    policy: None
    nameservers:
        - 1.1.1.1
        - 127.0.0.1
#affinity:
#  nodeAffinity:
#    requiredDuringSchedulingIgnoredDuringExecution:
#      nodeSelectorTerms:
#        - matchExpressions:
#            - key: kubernetes.io/hostname
#              operator: In
#              values:
#                - node03
#probes:
#    liveness:
#        initialDelaySeconds: 30
#    readiness:
#        initialDelaySeconds: 30
# Never on the same node as pihole-02 (its standby: a node failure must not
# take both) or pihole-03. Both use nameOverride, so their own name labels.
affinity:
    podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - pihole-02
                        - pihole-03
              topologyKey: kubernetes.io/hostname
# Reschedule faster on ungraceful node failure. Together with Longhorn's
# nodeDownPodDeletionPolicy this lets the pod move off a dead node instead of
# waiting for the default 300s unreachable/not-ready toleration.
tolerations:
    - key: node.kubernetes.io/unreachable
      operator: Exists
      effect: NoExecute
      tolerationSeconds: 30
    - key: node.kubernetes.io/not-ready
      operator: Exists
      effect: NoExecute
      tolerationSeconds: 30
# Pod hostname = Service name: Pi-hole accepts its own hostname as Host
# header without a password, so nebula-sync can use http://pihole-web
hostname: ENC[AES256_GCM,data:PIxb1sUXoMGtzg==,iv:d2NuFt9U048TvxlJzqJ/fHWHqUfS2cj81q5nr0i8MqE=,tag:kiDG4UFUeQU7xy1Ll+pajA==,type:str]
# The API has no password (Authelia protects the UI), so only Traefik,
# nebula-sync and Prometheus (exporter port) may reach the web port.
# DNS and DHCP stay open to every source.
networkPolicy:
    enabled: true
    ingress:
        from:
            - namespaceSelector:
                matchLabels:
                    kubernetes.io/metadata.name: kube-system
              podSelector:
                matchLabels:
                    app.kubernetes.io/name: traefik
            - podSelector:
                matchLabels:
                    app: nebula-sync
            # Metrics: the chart puts the exporter port into the same rule as the web port
            - namespaceSelector:
                matchLabels:
                    kubernetes.io/metadata.name: monitoring
              podSelector:
                matchLabels:
                    app.kubernetes.io/name: prometheus
# pihole-exporter sidecar (talks to Pi-hole via the pod IP, no password needed)
# and a PodMonitor; Prometheus egress to dns:9617 is in apps/monitoring
monitoring:
    sidecar:
        enabled: true
    podMonitor:
        enabled: true
