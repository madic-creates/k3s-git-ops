    customSettings:
        - dhcp-option=252,"\n"
        - dhcp-option=vendor:MSFT,2,1i
        # DNS
        # pihole-01 and its standby pihole-02: same rules, so clients can fail over
        - dhcp-option=6,192.168.1.232,192.168.1.234
        # NTP
        - dhcp-option=42,192.168.1.1
        # Server-ID = relay address (dhcphelper node IP) instead of the pod IP,
        # so unicast renewals reach the relay instead of an unroutable pod IP
