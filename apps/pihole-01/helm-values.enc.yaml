    type: LoadBalancer
    #externalTrafficPolicy: Cluster
    #type: ClusterIP
serviceDhcp:
    annotations:
        lbipam.cilium.io/ips: 192.168.1.232
        lbipam.cilium.io/sharing-key: piholednsdhcp
    type: LoadBalancer
virtualHost: ENC[AES256_GCM,data:/HWWWwQb7E8ZZVLmFbWYH99QJKiOerYs2ltlGQ==,iv:9aiBNvUR5R6tscppQ+rYw6LPXVUoprClQ1XfpDugWLo=,tag:hfENx22aPMVNcYYf+IDIxw==,type:str]
