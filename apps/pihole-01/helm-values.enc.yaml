    type: LoadBalancer
    #externalTrafficPolicy: Cluster
    #type: ClusterIP
serviceDhcp:
    annotations:
        lbipam.cilium.io/ips: 192.168.1.232
        lbipam.cilium.io/sharing-key: piholednsdhcp
    type: LoadBalancer
virtualHost: ENC[AES256_GCM,data:/H4PBN3yy77xQ7HnsFxMBPfqk8eADL19kwdA0A==,iv:6dfAAxfOtHFoz0H/JO4REeQJzXmZUANAlUcAhY5KYUk=,tag:6E7YcIXVkqyVlaTSU0QjVQ==,type:str]
