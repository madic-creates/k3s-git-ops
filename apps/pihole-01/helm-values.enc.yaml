        lbipam.cilium.io/sharing-key: piholednsdhcp
    # type LoadBalancer with externalTrafficPolicy Local
    # requires 192.168.1.232 on the same node as the pod
    type: LoadBalancer
    #externalTrafficPolicy: Cluster
    #type: ClusterIP
serviceDhcp:
    annotations:
        lbipam.cilium.io/ips: 192.168.1.232
        lbipam.cilium.io/sharing-key: piholednsdhcp
    type: LoadBalancer
virtualHost: ENC[AES256_GCM,data:aBsBdPKOhs7SWj+FFIxRrtgycd1UzVk8jBTWOw==,iv:Lfyy1cYJ8cskYjhQd9XmhTOMwMHz5wgq0+drYW6bnK4=,tag:2sOz7E4uCESz2q7BY0o7UQ==,type:str]
ingress:
