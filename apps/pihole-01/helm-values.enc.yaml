ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
        - ENC[AES256_GCM,data:DAylykjRZNMf6Ih65l/XiY73t80qmWnu9UHQ6w==,iv:/CTPyHY5+IXxiBdbNBGGDxZ7pj+PN+uesYiyLFk8xUc=,tag:lkje8UjQ/ig67osIr4Ttpw==,type:str]
    tls:
