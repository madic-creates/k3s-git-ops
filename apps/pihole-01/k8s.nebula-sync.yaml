---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nebula-sync
  namespace: dns
  labels:
    app: nebula-sync
  annotations:
    # After both Pi-holes (pihole-01 wave 0, pihole-03 wave 1)
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: nebula-sync
  template:
    metadata:
      labels:
        app: nebula-sync
    spec:
      containers:
      - name: nebula-sync
        image: ghcr.io/lovelaze/nebula-sync:v0.11.3
        envFrom:
        - configMapRef:
            name: nebula-sync-config
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            #cpu: "200m"
