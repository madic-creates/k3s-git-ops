---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: dhcphelper
  name: dhcphelper
  namespace: dns
  annotations:
    # After pihole-01 (wave 0): the required podAffinity needs its pod scheduled
    argocd.argoproj.io/sync-wave: "2"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: dhcphelper
  replicas: 1
  revisionHistoryLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dhcphelper
    spec:
      containers:
        - name: dhcphelper
          image: homeall/dhcphelper:latest@sha256:9906f6f3ca451925ca3fc41e1ce80edd4143446e39e169f4461b74178c3bdf82
          env:
            - name: IP
              value: "192.168.1.232"
            - name: TZ
              value: "Europe/Berlin"
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
          resources:
            limits:
              cpu: 100m
              memory: 32Mi
            requests:
              cpu: 100m
              memory: 32Mi
      hostNetwork: true
      # dhcp-helper runs as PID 1 without a SIGTERM handler, so it would only
      # die after the full grace period. It is a stateless UDP relay.
      terminationGracePeriodSeconds: 1
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values:
                      - pihole
                  # Only the pihole-01 release serves DHCP
                  - key: app.kubernetes.io/instance
                    operator: In
                    values:
                      - pihole
              topologyKey: "kubernetes.io/hostname"
  strategy:
    type: Recreate
