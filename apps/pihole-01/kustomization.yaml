---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dns

resources:
  - namespace.yaml
  - k8s.dhcprelay.yaml
  - k8s.nebula-sync.yaml
  - k8s.pdb.pihole.yaml

generators:
  - kustomize-secret-generator.yaml

# Sync waves are set per resource: these manifests are rendered by
# 12-pihole-helm together with the Pi-hole releases (waves 0, 1 and 2).
#   -2 namespace, -1 PDB, 3 nebula-sync and the dhcphelpers (after the Pi-holes)
