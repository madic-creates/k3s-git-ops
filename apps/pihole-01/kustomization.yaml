---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dns

resources:
  - namespace.yaml
  - k8s.dhcprelay.yaml
  #- k8s.pihole-exporter.yaml
  - k8s.nebula-sync.yaml
  - k8s.pdb.pihole.yaml

generators:
  - kustomize-secret-generator.yaml

# Sync waves are set per resource: these manifests are rendered by
# 12-pihole-helm together with both Pi-hole releases (wave 0 and 1).
#   -2 namespace, -1 PDB, 2 nebula-sync and dhcphelper (after the Pi-holes)
