---
# Houndarr searches the Sonarr/Radarr "missing" and "cutoff unmet" backlog in
# small, rate-limited batches. Instances and limits are configured in its web
# UI and stored in SQLite on /data, together with the master key that
# encrypts the stored *arr API keys. SQLite: never more than one replica.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: houndarr
  namespace: downloader
  annotations:
    argocd.argoproj.io/sync-wave: "30"
  labels:
    app.kubernetes.io/name: houndarr
spec:
  replicas: 1
  revisionHistoryLimit: 3
  # The data volume is ReadWriteOnce and holds a SQLite database; a rolling
  # update would let a second pod open it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: houndarr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: houndarr
    spec:
      # Same node as the other downloader apps so the hourly downloader
      # backup job can mount this RWO volume alongside theirs.
      nodeSelector:
        node-role/workload: zfs
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
      containers:
        - name: houndarr
          image: ghcr.io/av1155/houndarr:v1.13.3
          ports:
            - containerPort: 8877
              name: http
              protocol: TCP
          env:
            - name: TZ
              value: "Europe/Berlin"
            - name: HOUNDARR_SECURE_COOKIES
              value: "true"
            # Login is handled by Authelia forward-auth in Traefik, which
            # passes the user in Remote-User. Houndarr only honours the header
            # from trusted proxies; the pod CIDR is trusted because the
            # network policy admits nothing but Traefik on port 8877.
            - name: HOUNDARR_AUTH_MODE
              value: "proxy"
            - name: HOUNDARR_AUTH_PROXY_HEADER
              value: "Remote-User"
            - name: HOUNDARR_TRUSTED_PROXIES
              value: "10.42.0.0/16"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: longhorn-pvc-houndarr-data
