apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: downloader

resources:
  - k8s.cronjob.yaml
  - k8s.np.configarr.yaml

# Hash suffix makes the CronJob pick up config changes on the next sync.
configMapGenerator:
  - name: configarr-config
    files:
      - config.yml
    options:
      annotations:
        argocd.argoproj.io/sync-wave: "30"

generators:
  - kustomize-secret-generator.yaml
