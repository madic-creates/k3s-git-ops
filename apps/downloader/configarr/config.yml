# Configarr configuration: syncs TRaSH-Guides quality profiles, custom formats
# and quality sizes into the *arr apps.
# Reference: https://configarr.de/docs/configuration/config-file

trashGuideUrl: https://github.com/TRaSH-Guides/Guides

# Lidarr follows in a later step.
lidarrEnabled: false
readarrEnabled: false
whisparrEnabled: false

sonarr:
  sonarr:
    base_url: http://sonarr.downloader.svc.cluster.local:8989
    api_key: !env SONARR_API_KEY

    # TRaSH series quality sizes (sonarr/quality-size/series.json)
    quality_definition:
      type: series

    include:
      - template: dca7e5e9e99c703bcbdaaa471dd40e98 # [German] HD Bluray + WEB
        source: TRASH
      - template: 3b0fa37fddaaefc931b75f2889d4b4f5 # [German] UHD Bluray + WEB
        source: TRASH
      - template: 72dae194fc92bf828f32cde7744e51a1 # WEB-1080p
        source: TRASH
      - template: 6fe5937e1dcc2269e23b49eb46dfe6d6 # [German] Anime HD Bluray + WEB
        source: TRASH
      - template: 20e0fc959f1f1704bed501f23bdae76f # [Anime] Remux-1080p
        source: TRASH

    # Same HDR handling as the Radarr 4k profile.
    custom_format_groups:
      - trash_guide:
          - id: e0b2774083df4265f25c9e5bc6c80940 # [HDR Formats] DV Boost
          - id: 7d366c213e5c23a052b157356fac1921 # [HDR Formats] HDR10+ Boost
          - id: d776a1ea912a117d66d83b880ff2055d # [HDR Formats] DV (w/o HDR fallback)
        assign_scores_to:
          - name: "<=4k DE"

    custom_formats:
      # English shows: reject releases without English audio (replaces the
      # old hand-made "Language: English" CF).
      - trash_ids:
          - 69aa1e159f97d860440b04cd6d590c4f # Language: Not English
        assign_scores_to:
          - name: "<=1080p EN"
      # Japanese anime: reject releases without the original (Japanese) audio.
      - trash_ids:
          - ae575f95ab639ba5d15f663bf019e3e8 # Language: Not Original
        assign_scores_to:
          - name: "<=1080p Anime JP"

    # The three existing profiles keep their names (series stay assigned);
    # the two anime profiles are new and series have to be moved by hand.
    renameQualityProfiles:
      - from: "[German] HD Bluray + WEB"
        to: "<=1080p DE"
      - from: "[German] UHD Bluray + WEB"
        to: "<=4k DE"
      - from: "WEB-1080p"
        to: "<=1080p EN"
      - from: "[German] Anime HD Bluray + WEB"
        to: "<=1080p Anime DE"
      - from: "[Anime] Remux-1080p"
        to: "<=1080p Anime JP"

    # Same rules as for Radarr: German audio mandatory (min score 10000),
    # until_score capped at the base score so existing files never trigger a
    # re-download, and the full quality order spelled out so better disabled
    # qualities stay above the allowed group (first entry = highest).
    # SD, DVD, 480p and HDTV are no longer allowed (TRaSH); existing episodes
    # in those qualities are below the cutoff and get replaced when RSS finds
    # an allowed release.
    quality_profiles:
      - name: "<=1080p DE"
        min_format_score: 10000
        upgrade:
          allowed: true
          until_score: 10000
        qualities:
          - name: Bluray-2160p Remux
            enabled: false
          - name: Bluray-2160p
            enabled: false
          - name: WEBRip-2160p
            enabled: false
          - name: WEBDL-2160p
            enabled: false
          - name: HDTV-2160p
            enabled: false
          - name: Bluray-1080p Remux
            enabled: false
          - name: Merged QPs
            qualities:
              - Bluray-1080p
              - WEBRip-1080p
              - WEBDL-1080p
              - Bluray-720p
              - WEBDL-720p
              - WEBRip-720p
          - name: Raw-HD
            enabled: false
          - name: HDTV-1080p
            enabled: false
          - name: HDTV-720p
            enabled: false
          - name: Bluray-576p
            enabled: false
          - name: Bluray-480p
            enabled: false
          - name: DVD
            enabled: false
          - name: WEBRip-480p
            enabled: false
          - name: WEBDL-480p
            enabled: false
          - name: SDTV
            enabled: false
          - name: Unknown
            enabled: false
      - name: "<=4k DE"
        min_format_score: 10000
        upgrade:
          allowed: true
          until_score: 10000
        qualities:
          - name: Bluray-2160p Remux
            enabled: false
          - name: Merged QPs
            qualities:
              - Bluray-2160p
              - WEBDL-2160p
              - WEBRip-2160p
          - name: HDTV-2160p
            enabled: false
          - name: Bluray-1080p Remux
            enabled: false
          - name: Bluray-1080p
            enabled: false
          - name: WEBRip-1080p
            enabled: false
          - name: WEBDL-1080p
            enabled: false
          - name: Bluray-720p
            enabled: false
          - name: WEBRip-720p
            enabled: false
          - name: WEBDL-720p
            enabled: false
          - name: Raw-HD
            enabled: false
          - name: HDTV-1080p
            enabled: false
          - name: HDTV-720p
            enabled: false
          - name: Bluray-576p
            enabled: false
          - name: Bluray-480p
            enabled: false
          - name: DVD
            enabled: false
          - name: WEBRip-480p
            enabled: false
          - name: WEBDL-480p
            enabled: false
          - name: SDTV
            enabled: false
          - name: Unknown
            enabled: false
      - name: "<=1080p EN"
        upgrade:
          allowed: true
          until_score: 0
        qualities:
          - name: Bluray-2160p Remux
            enabled: false
          - name: Bluray-2160p
            enabled: false
          - name: WEBRip-2160p
            enabled: false
          - name: WEBDL-2160p
            enabled: false
          - name: HDTV-2160p
            enabled: false
          - name: Bluray-1080p Remux
            enabled: false
          - name: Bluray-1080p
            enabled: false
          - name: WEB 1080p
            qualities:
              - WEBRip-1080p
              - WEBDL-1080p
          - name: HDTV-1080p
            enabled: false
          - name: Bluray-720p
            enabled: false
          - name: WEBRip-720p
            enabled: false
          - name: WEBDL-720p
            enabled: false
          - name: Raw-HD
            enabled: false
          - name: HDTV-720p
            enabled: false
          - name: Bluray-576p
            enabled: false
          - name: Bluray-480p
            enabled: false
          - name: DVD
            enabled: false
          - name: WEBRip-480p
            enabled: false
          - name: WEBDL-480p
            enabled: false
          - name: SDTV
            enabled: false
          - name: Unknown
            enabled: false
      - name: "<=1080p Anime DE"
        min_format_score: 10000
        upgrade:
          allowed: true
          until_score: 10000
        qualities:
          - name: Bluray-2160p Remux
            enabled: false
          - name: Bluray-2160p
            enabled: false
          - name: WEBRip-2160p
            enabled: false
          - name: WEBDL-2160p
            enabled: false
          - name: HDTV-2160p
            enabled: false
          - name: Bluray-1080p Remux
            enabled: false
          - name: Merged QPs
            qualities:
              - Bluray-1080p
              - WEBRip-1080p
              - WEBDL-1080p
              - Bluray-720p
              - WEBDL-720p
              - WEBRip-720p
          - name: Raw-HD
            enabled: false
          - name: HDTV-1080p
            enabled: false
          - name: HDTV-720p
            enabled: false
          - name: Bluray-576p
            enabled: false
          - name: Bluray-480p
            enabled: false
          - name: DVD
            enabled: false
          - name: WEBRip-480p
            enabled: false
          - name: WEBDL-480p
            enabled: false
          - name: SDTV
            enabled: false
          - name: Unknown
            enabled: false
      # TRaSH minimum score 100 kept (known anime groups only). Cutoff
      # WEB 1080p instead of TRaSH's Bluray 1080p so existing WEB episodes
      # are not upgraded.
      - name: "<=1080p Anime JP"
        upgrade:
          allowed: true
          until_quality: WEB 1080p
          until_score: 0
        qualities:
          - name: Bluray-2160p Remux
            enabled: false
          - name: Bluray-2160p
            enabled: false
          - name: WEBRip-2160p
            enabled: false
          - name: WEBDL-2160p
            enabled: false
          - name: HDTV-2160p
            enabled: false
          - name: Bluray 1080p
            qualities:
              - Bluray-1080p Remux
              - Bluray-1080p
          - name: WEB 1080p
            qualities:
              - HDTV-1080p
              - WEBRip-1080p
              - WEBDL-1080p
          - name: Bluray-720p
          - name: WEB 720p
            qualities:
              - HDTV-720p
              - WEBRip-720p
              - WEBDL-720p
          - name: Raw-HD
            enabled: false
          - name: Bluray-576p
            enabled: false
          - name: Bluray-480p
          - name: WEB 480p
            qualities:
              - WEBRip-480p
              - WEBDL-480p
          - name: DVD
          - name: SDTV
          - name: Unknown
            enabled: false

radarr:
  radarr:
    base_url: http://radarr.downloader.svc.cluster.local:7878
    api_key: !env RADARR_API_KEY

    # TRaSH movie quality sizes (radarr/quality-size/movie.json)
    quality_definition:
      type: movie

    # TRaSH quality profiles. Their default CF groups (unwanted formats,
    # repack/proper, streaming services, HDR) are loaded automatically.
    include:
      - template: 2b90e905c99490edc7c7a5787443748b # [German] HD Bluray + WEB
        source: TRASH
      - template: 27cc3d153c0a799fd139ef1ff4c4cc42 # [German] UHD Bluray + WEB
        source: TRASH
      - template: d1d67249d3890e49bc12e275d989a7e9 # HD Bluray + WEB
        source: TRASH
      - template: 722b624f9af1e492284c4bc842153a38 # [Anime] Remux-1080p
        source: TRASH

    # Optional TRaSH HDR groups for the 4k profile. The default HDR group
    # (HDR 500) is loaded automatically; these add the Dolby Vision and HDR10+
    # boosts and reject DV releases without an HDR10 fallback, which not every
    # player can show.
    custom_format_groups:
      - trash_guide:
          - id: 1616617ab3a14397a2b2321bcbda44d1 # [HDR Formats] DV Boost
          - id: b29413a7487478fe98228ce79e5689e4 # [HDR Formats] HDR10+ Boost
          - id: 7fc2751eef7e6bdc70b74136e5e35c76 # [HDR Formats] DV (w/o HDR fallback)
        assign_scores_to:
          - name: "German - 4k"

    # Map the TRaSH profiles onto the existing Radarr profiles so every movie
    # keeps its profile assignment.
    renameQualityProfiles:
      - from: "[German] HD Bluray + WEB"
        to: "German - 720p/1080p"
      - from: "[German] UHD Bluray + WEB"
        to: "German - 4k"
      - from: "HD Bluray + WEB"
        to: "English - 720p/1080p"
      - from: "[Anime] Remux-1080p"
        to: "Japanese - 720p/1080p"

    # Overrides merged on top of the TRaSH profiles.
    #
    # German audio is mandatory: the German profiles use language "Any" and the
    # "German" CF scores 10000, so a minimum score of 10000 rejects every
    # release without German audio (TRaSH's documented German-only setup).
    #
    # No upgrade wave: TRaSH upgrades until 35000 (German) / 10000 (English,
    # Anime).
    # Capping until_score at the base score means an existing file already
    # meets the cutoff, so release-group tiers, German DL and boosters only
    # steer the first grab and never trigger a re-download.
    #
    # Quality order: TRaSH only lists the merged group, so Configarr ranked
    # every other quality below it. Radarr then treated existing Remux-1080p,
    # 2160p and BR-DISK files as below the cutoff and would have replaced them
    # with any 1080p release. The disabled qualities that rank higher are
    # listed above the merged group again (first entry = highest), matching
    # the order the profiles had before Configarr. The full list is spelled
    # out because Configarr moves unlisted qualities to the top.
    quality_profiles:
      - name: "German - 720p/1080p"
        min_format_score: 10000
        upgrade:
          allowed: true
          until_score: 10000
        qualities:
          - name: Raw-HD
            enabled: false
          - name: BR-DISK
            enabled: false
          - name: Remux-2160p
            enabled: false
          - name: Bluray-2160p
            enabled: false
          - name: WEBDL-2160p
            enabled: false
          - name: WEBRip-2160p
            enabled: false
          - name: HDTV-2160p
            enabled: false
          - name: Remux-1080p
            enabled: false
          - name: Merged QPs
            qualities:
              - Bluray-1080p
              - WEBRip-1080p
              - WEBDL-1080p
              - Bluray-720p
              - WEBDL-720p
              - WEBRip-720p
          - name: HDTV-1080p
            enabled: false
          - name: HDTV-720p
            enabled: false
          - name: Bluray-576p
            enabled: false
          - name: Bluray-480p
            enabled: false
          - name: WEBDL-480p
            enabled: false
          - name: WEBRip-480p
            enabled: false
          - name: DVD-R
            enabled: false
          - name: DVD
            enabled: false
          - name: SDTV
            enabled: false
          - name: DVDSCR
            enabled: false
          - name: REGIONAL
            enabled: false
          - name: TELECINE
            enabled: false
          - name: TELESYNC
            enabled: false
          - name: CAM
            enabled: false
          - name: WORKPRINT
            enabled: false
          - name: Unknown
            enabled: false
      - name: "German - 4k"
        min_format_score: 10000
        upgrade:
          allowed: true
          until_score: 10000
        qualities:
          - name: Raw-HD
            enabled: false
          - name: BR-DISK
            enabled: false
          - name: Remux-2160p
            enabled: false
          - name: Merged QPs
            qualities:
              - Bluray-2160p
              - WEBDL-2160p
              - WEBRip-2160p
          - name: HDTV-2160p
            enabled: false
          - name: Remux-1080p
            enabled: false
          - name: Bluray-1080p
            enabled: false
          - name: WEBDL-1080p
            enabled: false
          - name: WEBRip-1080p
            enabled: false
          - name: HDTV-1080p
            enabled: false
          - name: Bluray-720p
            enabled: false
          - name: WEBDL-720p
            enabled: false
          - name: WEBRip-720p
            enabled: false
          - name: HDTV-720p
            enabled: false
          - name: Bluray-576p
            enabled: false
          - name: Bluray-480p
            enabled: false
          - name: WEBDL-480p
            enabled: false
          - name: WEBRip-480p
            enabled: false
          - name: DVD-R
            enabled: false
          - name: DVD
            enabled: false
          - name: SDTV
            enabled: false
          - name: DVDSCR
            enabled: false
          - name: REGIONAL
            enabled: false
          - name: TELECINE
            enabled: false
          - name: TELESYNC
            enabled: false
          - name: CAM
            enabled: false
          - name: WORKPRINT
            enabled: false
          - name: Unknown
            enabled: false
      - name: "English - 720p/1080p"
        upgrade:
          allowed: true
          until_score: 0
      # TRaSH anime profile: original (Japanese) audio, anime release groups.
      # Its minimum score of 100 is kept, so only releases from known anime
      # groups are grabbed. The quality cutoff stays at WEB 1080p (TRaSH:
      # Remux 1080p) so existing WEB files are not upgraded to Remux.
      - name: "Japanese - 720p/1080p"
        upgrade:
          allowed: true
          until_quality: WEB 1080p
          until_score: 0
