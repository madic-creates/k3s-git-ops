apiVersion: apps/v1
kind: Deployment
metadata:
  name: nzbget
  namespace: downloader
  annotations:
    argocd.argoproj.io/sync-wave: "30"
  labels:
    app.kubernetes.io/name: nzbget
spec:
  replicas: 1
  revisionHistoryLimit: 3
  # The config volume is ReadWriteOnce; a rolling update would let a second
  # pod attach it and write the same database.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: nzbget
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nzbget
    spec:
      nodeSelector:
        node-role/workload: zfs
      initContainers:
      # One-time migration of a NZBGet 21.x config to nzbget-ng (v23+), which
      # addresses extensions by name instead of by script path. Rewrites
      # "FakeDetector/FakeDetector.py" to "FakeDetector" in the extension
      # lists and "GetScripts/DeleteSamples.py:Opt=" to "DeleteSamples:Opt="
      # for script options, and fixes MainDir, which 21.x ignored. Idempotent,
      # so it is a no-op on every later start.
      - name: migrate-config
        image: forge.geekbundle.org/madic/docker-nzbget@sha256:TODO
        command:
          - sh
          - -euc
          - |
            conf=/config/nzbget.conf
            [ -f "$conf" ] || exit 0
            sed -i -E \
              -e '/^(Category[0-9]+\.Extensions|Extensions|ScriptOrder)=/{s#[A-Za-z0-9_]+/##g;s#\.(py|sh)##g}' \
              -e 's#^([A-Za-z0-9_]+/)?([A-Za-z0-9_]+)\.(py|sh):#\2:#' \
              -e 's#^MainDir=\$\(AppDir\)$#MainDir=/config#' \
              "$conf"
        volumeMounts:
          - name: config
            mountPath: /config
      containers:
      - name: nzbget
        image: forge.geekbundle.org/madic/docker-nzbget@sha256:TODO
        env:
          - name: PUID
            value: "0"
          - name: PGID
            value: "1002"
          - name: TZ
            value: "Europe/Berlin"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
        ports:
          - containerPort: 6789
            name: http
            protocol: TCP
        volumeMounts:
          - name: config
            mountPath: /config
          # nzbget-ng checks that ScriptDir is writable (extension manager).
          - name: scripts
            mountPath: /app/nzbget/scripts
          - name: video
            mountPath: /vol_raidz1/video
          - name: music
            mountPath: /vol_raidz1/music
          - name: photo
            mountPath: /vol_raidz1/photo
          - name: downloads
            mountPath: /vol_raidz1/downloads
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: longhorn-pvc-nzbget-config
        - name: scripts
          persistentVolumeClaim:
            claimName: longhorn-pvc-nzbget-scripts
        - name: video
          hostPath:
            path: /vol_raidz1/video
            type: Directory
        - name: music
          hostPath:
            path: /vol_raidz1/music
            type: Directory
        - name: photo
          hostPath:
            path: /vol_raidz1/photo
            type: Directory
        - name: downloads
          hostPath:
            path: /vol_raidz1/downloads
            type: Directory
