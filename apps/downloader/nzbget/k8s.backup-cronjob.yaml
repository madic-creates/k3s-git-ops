---
# Hourly backup of *arr-stack and downloader configs via restic.
# Every config tree is a ReadWriteOnce Longhorn PVC, mounted read-only.
# The nodeSelector below pins this Job to the same node as the workloads,
# which is what allows it to attach volumes those pods already hold.
# Headphones and Epic Games are intentionally excluded — they are
# not mounted, so restic never sees them.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-downloader
  namespace: downloader
spec:
  schedule: "50 * * * *"
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 1
  successfulJobsHistoryLimit: 1
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 540
      template:
        metadata:
          labels:
            app.kubernetes.io/name: backup-downloader
            app.kubernetes.io/component: backup
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          # All downloader apps share PGID 1002 (PUIDs differ: 0/1000/1001).
          # Running as that group gives restic read access to every config
          # file via the group bit (linuxserver.io umask 022 → mode 644).
          securityContext:
            runAsUser: 1000
            runAsGroup: 1002
            runAsNonRoot: true
          nodeSelector:
            node-role/workload: zfs
          containers:
            - name: restic
              image: ghcr.io/madic-creates/container-restic:latest@sha256:0370748872a2ddcc932be6e31c33d0046cdee142cca9d2faa381885041a35fd1
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - /usr/local/bin/backup.sh
              env:
                # Give restic a writable HOME so it can keep its repo cache
                # under $HOME/.cache/restic between runs.
                - name: HOME
                  value: /home/restic
              envFrom:
                - secretRef:
                    name: backup-env-configuration-downloader
              volumeMounts:
                - name: backup-script
                  mountPath: /usr/local/bin/backup.sh
                  subPath: backup.sh
                - name: home
                  mountPath: /home/restic
                - name: sonarr-config
                  mountPath: /backup/sonarr
                  readOnly: true
                - name: radarr-config
                  mountPath: /backup/radarr
                  readOnly: true
                - name: nzbget-config
                  mountPath: /backup/nzbget
                  readOnly: true
                - name: nzbhydra2-config
                  mountPath: /backup/nzbhydra2
                  readOnly: true
                - name: trailarr-config
                  mountPath: /backup/trailarr
                  readOnly: true
                - name: lidarr-config
                  mountPath: /backup/lidarr
                  readOnly: true
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                privileged: false
          volumes:
            - name: backup-script
              configMap:
                name: crontab-backup-script
            - name: home
              emptyDir:
                medium: Memory
                sizeLimit: 500Mi
            - name: sonarr-config
              persistentVolumeClaim:
                claimName: longhorn-pvc-sonarr-config
            - name: radarr-config
              persistentVolumeClaim:
                claimName: longhorn-pvc-radarr-config
            - name: nzbget-config
              persistentVolumeClaim:
                claimName: longhorn-pvc-nzbget-config
            - name: nzbhydra2-config
              persistentVolumeClaim:
                claimName: longhorn-pvc-nzbhydra2-config
            - name: trailarr-config
              persistentVolumeClaim:
                claimName: longhorn-pvc-trailarr-config
            - name: lidarr-config
              persistentVolumeClaim:
                claimName: longhorn-pvc-lidarr-config
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: backup-downloader
  namespace: downloader
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: backup-downloader
  egress:
    # DNS
    - toEndpoints:
        - matchLabels:
            k8s:io.cilium.k8s.namespace.labels.kubernetes.io/metadata.name: kube-system
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # Prometheus Pushgateway (metrics)
    - toEndpoints:
        - matchLabels:
            k8s:io.cilium.k8s.namespace.labels.kubernetes.io/metadata.name: monitoring
            k8s:io.kubernetes.pod.namespace: monitoring
            k8s:app.kubernetes.io/name: prometheus-pushgateway
      toPorts:
        - ports:
            - port: "9091"
              protocol: TCP
    # Local restic REST-server (primary backup target)
    - toEndpoints:
        - matchLabels:
            k8s:io.cilium.k8s.namespace.labels.kubernetes.io/metadata.name: backup
            k8s:io.kubernetes.pod.namespace: backup
            k8s:app.kubernetes.io/name: rest-server
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    # ntfy notifications on failure
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
