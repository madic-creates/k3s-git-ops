# Grafana dashboard for household electricity consumption and PV generation.
# Discovered automatically by the Grafana sidecar via the grafana_dashboard label.
#
# Data sources: fritzbox-exporter (grid import, via the FRITZ!Smart Energy plug),
# mqtt2prometheus in the solar namespace (Deye SUN-M160G4 micro inverter) and
# openmeteo-exporter, also in solar, which supplies the irradiance reference the
# expected-yield comparison is built on.
# Derived series come from apps/monitoring/k8s.prometheusrule.energy.yaml.
#
# Series colours are fixed rather than themed because a Grafana dashboard JSON
# carries one palette for both light and dark. #CF7526 (generation), #4C7EE0
# (grid) and #199e70 (export) were validated together to pass the lightness
# band, chroma floor, CVD separation and contrast checks against both surfaces;
# the four-string palette below likewise, with the yellow relying on the table
# legend for label relief.
#
# The grid series is SIGNED: positive while importing, negative while exporting.
# Neither power panel may set `min: 0` or the export half is clipped away.
#
# Cost layer: the "Kosten & Ersparnis" row prices every energy figure. The
# tariff is not hardcoded into the queries — it lives in four textbox
# variables at the top of the dashboard (price, feedin, base, invest), so a
# tariff change is a one-line default in this file, and "what if it goes to
# 35 ct" is answerable in the browser without a commit. Enter them with a DOT
# as the decimal separator: these are PromQL literals, not German notation.
#
# Two consequences of holding the price in a variable rather than a metric: a
# change reprices the entire history, and there is no record of what the
# tariff was in June. Both are acceptable for a fixed tariff and both stop
# being acceptable the day a dynamic one (Tibber, aWATTar) arrives — at that
# point the price becomes a scraped series and the panels join against it.
# The panel structure survives that migration unaltered.
#
# feedin is 0 deliberately, not as a placeholder: this plant's surplus goes
# into the grid uncompensated. That is what makes "Entgangen" the interesting
# number of the row — it is the full retail value of energy given away, and
# therefore the ceiling on what a battery or any load shifting could ever
# recover. It is green like every other export series here; the colour tracks
# the measured quantity, not whether the number is good news.
#
# The euro figures inherit one unverified assumption from the energy panels:
# whether fritz_ha_multimeter_energy_Wh counts import only, or the magnitude
# in both directions. If it is the latter, "Netzbezug" and every cost figure
# derived from it run high by the exported amount. Left standing rather than
# guessed at — the "Bezahlt heute" panel description carries the one-line
# check.
#
# No new recording rules back any of this. The rules file argues explicitly
# against recording the export as its own series, because a rule created
# today carries no history; a recorded cost would fail the same way — it
# could not render yesterday.
#
# On rows: a Grafana row owns every panel below it until the next row, so
# inserting one adopts whatever follows. The cost row did exactly that to the
# three generation panels on its first commit. Anything added between rows
# from now on needs its own row header, or it silently joins the section
# above it.
#
# On the payback figures: cumulative savings are anchored on the inverter's
# lifetime counter, not on integrating Prometheus history, because retention
# is 45 days. A Prometheus-only "since commissioning" sum is correct today and
# silently stops being a total on 2026-10-20, when the first operating days
# age out -- it would keep rendering and simply be wrong. The self-consumption
# share cannot be sourced that way and does come from the rolling 30-day
# window, applied to the whole operating period; that is the one assumption in
# "Eingespielt", and it holds only while the base load absorbs nearly all
# generation, as it currently does at 99%.
#
# The remaining-time panel divides by the average since commissioning rather
# than extrapolating a 30-day window. A window never improves -- it stays
# seasonally biased forever -- while the average covers more seasons every
# month and corrects itself. Until roughly 365 operating days it reads
# optimistic, which the panel says.
#
# The commissioning date (2026-09-05) is a constant variable in this file, not
# a metric. Tilt, azimuth and peak power live in the openmeteo exporter
# because recording rules read them and rules can only read metrics; the date
# is read by panels in this file alone. The inverter cannot supply it either:
# deye_uptime_minutes resets every night.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-energy
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  energy.json: |-
    {
      "annotations": {"list": []},
      "editable": true,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "type": "stat",
          "title": "Erzeugung",
          "description": "Aktuelle AC-Leistung des Deye-Wechselrichters.",
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0},
          "id": 1,
          "fieldConfig": {
            "defaults": {
              "unit": "watt",
              "decimals": 0,
              "color": {"mode": "fixed", "fixedColor": "#CF7526"},
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "textMode": "auto",
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}
          },
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
              "expr": "home:power_generation:watts",
              "legendFormat": "Erzeugung",
              "refId": "A"
            }
          ]
        },
        {
          "type": "stat",
          "title": "Netzleistung",
          "description": "Leistung am Netzanschluss, gemessen von der FRITZ!Smart Energy 250. Positiv = Bezug aus dem Netz, negativ = Einspeisung des PV-Überschusses. Die Steckdose misst vorzeichenbehaftet.",
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "gridPos": {"h": 4, "w": 6, "x": 6, "y": 0},
          "id": 2,
          "fieldConfig": {
            "defaults": {
              "unit": "watt",
              "decimals": 0,
              "color": {"mode": "fixed", "fixedColor": "#4C7EE0"},
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "textMode": "auto",
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}
          },
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
              "expr": "home:power_grid_import:watts",
              "legendFormat": "Netz",
              "refId": "A"
            }
          ]
        },
        {
          "type": "stat",
          "title": "Gesamtverbrauch",
          "description": "Netzleistung plus Erzeugung. Weil die Netzmessung vorzeichenbehaftet ist, stimmt das in beide Richtungen: bei Einspeisung ist der Netzwert negativ, sodass die Summe die tatsächliche Hauslast ergibt.",
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "gridPos": {"h": 4, "w": 6, "x": 12, "y": 0},
          "id": 3,
          "fieldConfig": {
            "defaults": {
              "unit": "watt",
              "decimals": 0,
              "color": {"mode": "fixed", "fixedColor": "text"},
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "textMode": "auto",
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}
          },
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
              "expr": "home:power_total:watts",
              "legendFormat": "Gesamtverbrauch",
              "refId": "A"
            }
          ]
        },
        {
          "type": "gauge",
          "title": "Autarkie",
          "description": "Anteil des Gesamtverbrauchs, der gerade aus eigener Erzeugung gedeckt wird. Die Kappung auf 100% steht zusätzlich in der Query, damit auch Samples richtig dargestellt werden, die vor der Korrektur der Recording Rule aufgezeichnet wurden — Rules ändern die Vergangenheit nicht.",
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "gridPos": {"h": 4, "w": 6, "x": 18, "y": 0},
          "id": 4,
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "decimals": 0,
              "min": 0,
              "max": 100,
              "color": {"mode": "fixed", "fixedColor": "#CF7526"},
              "thresholds": {"mode": "absolute", "steps": [{"color": "#CF7526", "value": null}]},
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "showThresholdLabels": false,
            "showThresholdMarkers": false,
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}
          },
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
              "expr": "clamp_max(home:autarky:ratio, 1) * 100",
              "legendFormat": "Autarkie",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Leistung: Erzeugung und Netz (gestapelt)",
          "description": "Die Stapelhöhe ist der Gesamtverbrauch, der gelbe Anteil die Eigendeckung.",
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "gridPos": {"h": 9, "w": 16, "x": 0, "y": 4},
          "id": 5,
          "fieldConfig": {
            "defaults": {
              "unit": "watt",
              "decimals": 0,
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "fillOpacity": 70,
                "showPoints": "never",
                "stacking": {"mode": "normal", "group": "A"},
                "axisSoftMin": 0
              }
            },
            "overrides": [
              {
                "matcher": {"id": "byName", "options": "Erzeugung"},
                "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "#CF7526"}}]
              },
              {
                "matcher": {"id": "byName", "options": "Netz"},
                "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "#4C7EE0"}}]
              }
            ]
          },
          "options": {
            "legend": {"displayMode": "table", "placement": "bottom", "showLegend": true, "calcs": ["lastNotNull", "max", "mean"]},
            "tooltip": {"mode": "multi", "sort": "desc"}
          },
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
              "expr": "home:power_generation:watts",
              "legendFormat": "Erzeugung",
              "refId": "A"
            },
            {
              "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
              "expr": "home:power_grid_import:watts",
              "legendFormat": "Netz",
              "refId": "B"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Autarkie",
          "description": "Eigendeckungsgrad über die Zeit.",
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "gridPos": {"h": 9, "w": 8, "x": 16, "y": 4},
          "id": 6,
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "decimals": 0,
              "min": 0,
              "max": 100,
              "color": {"mode": "fixed", "fixedColor": "#CF7526"},
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "fillOpacity": 25,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {"displayMode": "list", "placement": "bottom", "showLegend": false},
            "tooltip": {"mode": "single", "sort": "none"}
          },
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
              "expr": "clamp_max(home:autarky:ratio, 1) * 100",
              "legendFormat": "Autarkie",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Energie pro Tag",
          "description": "Ein Balken je Kalendertag der letzten 14 Tage, nicht gestapelt. Die drei Werte überschneiden sich bewusst nicht: selbst genutzte PV plus Netzbezug ergibt den Verbrauch, selbst genutzte PV plus Einspeisung ergibt den PV-Ertrag. Deshalb steht hier \"selbst genutzt\" statt des vollen Ertrags — sonst wäre die Einspeisung darin doppelt enthalten. Der PV-Wert stammt aus der Tageszählung des Wechselrichters (max_over_time), nicht aus dem Zuwachs des Lebenszählers: nachts verschwinden die deye-Serien, und jede Messlücke würde den Zuwachs zu klein ausfallen lassen. Der Netzbezug muss den Zuwachs verwenden, weil die FRITZ-Steckdose keinen Tageszähler führt, dafür aber durchgehend läuft. Balken erscheinen erst ab dem ersten abgeschlossenen Tag, weil Grafana Range-Queries auf Vielfache des Schritts ausrichtet, bei Schritt 1d also auf Mitternacht.",
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "gridPos": {"h": 12, "w": 16, "x": 0, "y": 13},
          "id": 7,
          "interval": "1d",
          "timeFrom": "14d",
          "fieldConfig": {
            "defaults": {
              "unit": "kwatth",
              "decimals": 1,
              "custom": {
                "drawStyle": "bars",
                "barAlignment": 0,
                "barWidthFactor": 0.7,
                "lineWidth": 0,
                "fillOpacity": 90,
                "gradientMode": "none",
                "showPoints": "never",
                "axisSoftMin": 0
              }
            },
            "overrides": [
              {
                "matcher": {"id": "byName", "options": "PV selbst genutzt"},
                "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "#CF7526"}}]
              },
              {
                "matcher": {"id": "byName", "options": "Netzbezug"},
                "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "#4C7EE0"}}]
              },
              {
                "matcher": {"id": "byName", "options": "Einspeisung"},
                "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "#199e70"}}]
              }
            ]
          },
          "options": {
            "legend": {"displayMode": "table", "placement": "bottom", "showLegend": true, "calcs": ["lastNotNull", "mean"]},
            "tooltip": {"mode": "multi", "sort": "desc"}
          },
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
              "expr": "clamp_min(max(max_over_time(deye_production_today_kwh[1d])) - sum_over_time(clamp_min(-home:power_grid_import:watts, 0)[1d:1m]) / 60 / 1000, 0)",
              "format": "time_series",
              "interval": "1d",
              "legendFormat": "PV selbst genutzt",
              "refId": "A"
            },
            {
              "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
              "expr": "sum(increase(fritz_ha_multimeter_energy_Wh{ain=~\"16000.?0036823.*\"}[1d])) / 1000",
              "format": "time_series",
              "interval": "1d",
              "legendFormat": "Netzbezug",
              "refId": "B"
            },
            {
              "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
              "expr": "sum_over_time(clamp_min(-home:power_grid_import:watts, 0)[1d:1m]) / 60 / 1000",
              "format": "time_series",
              "interval": "1d",
              "legendFormat": "Einspeisung",
              "refId": "C"
            }
          ]
        },
        {
          "type": "stat",
          "title": "Ertrag heute",
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "gridPos": {"h": 4, "w": 8, "x": 16, "y": 13},
          "id": 8,
          "fieldConfig": {
            "defaults": {
              "unit": "kwatth",
              "decimals": 2,
              "color": {"mode": "fixed", "fixedColor": "#CF7526"},
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "textMode": "auto",
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}
          },
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
              "expr": "max(deye_production_today_kwh)",
              "legendFormat": "Heute",
              "refId": "A"
            }
          ]
        },
        {
          "type": "stat",
          "title": "Überschuss heute",
          "description": "Seit Mitternacht ins Netz eingespeiste Energie — minutenweise Integration der negativen Netzleistung. Eigener Zeitbereich \"now/d\", in Grafana dokumentiert als \"the day so far\". Abgeleitet aus home:power_grid_import:watts statt aus einer eigenen Export-Rule, weil diese Serie seit dem ersten Tag aufgezeichnet wird und der Wert damit auch rückwirkend stimmt.",
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "gridPos": {"h": 4, "w": 8, "x": 16, "y": 17},
          "id": 17,
          "timeFrom": "now/d",
          "fieldConfig": {
            "defaults": {
              "unit": "kwatth",
              "decimals": 2,
              "color": {"mode": "fixed", "fixedColor": "#199e70"},
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "textMode": "auto",
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}
          },
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
              "expr": "sum_over_time(clamp_min(-home:power_grid_import:watts, 0)[${__range_s}s:1m]) / 60 / 1000",
              "instant": true,
              "legendFormat": "Überschuss",
              "refId": "A"
            }
          ]
        },
        {
          "type": "stat",
          "title": "Ertrag gesamt",
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "gridPos": {"h": 4, "w": 8, "x": 16, "y": 21},
          "id": 9,
          "fieldConfig": {
            "defaults": {
              "unit": "kwatth",
              "decimals": 1,
              "color": {"mode": "fixed", "fixedColor": "text"},
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "textMode": "auto",
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}
          },
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
              "expr": "max(deye_production_total_kwh)",
              "legendFormat": "Gesamt",
              "refId": "A"
            }
          ]
        },
        {
          "type": "row",
          "title": "Kosten & Ersparnis",
          "collapsed": false,
          "gridPos": {"h": 1, "w": 24, "x": 0, "y": 25},
          "id": 101,
          "panels": []
        },
        {
          "type": "stat",
          "title": "Bezahlt heute",
          "description": "Netzbezug seit Mitternacht mal Strompreis. Der Zaehler der FRITZ-Steckdose liefert den Bezug; ob er ausschliesslich den Bezug hochzaehlt oder den Betrag in beide Richtungen, ist NICHT verifiziert. Im zweiten Fall enthaelt diese Zahl — und ebenso der Balken \"Netzbezug\" oben — zusaetzlich die eingespeiste Energie und liegt damit zu hoch. Pruefen laesst sich das, indem der Zaehlerzuwachs ueber 24 h gegen die Integration der positiven Leistung gestellt wird; sind beide nahe beieinander, zaehlt der Zaehler nur den Bezug.",
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "gridPos": {"h": 4, "w": 6, "x": 0, "y": 26},
          "id": 21,
          "timeFrom": "now/d",
          "fieldConfig": {
            "defaults": {
              "unit": "currencyEUR",
              "decimals": 2,
              "color": {"mode": "fixed", "fixedColor": "#4C7EE0"},
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "textMode": "auto",
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}
          },
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
              "expr": "sum(increase(fritz_ha_multimeter_energy_Wh{ain=~\"16000.?0036823.*\"}[${__range_s}s])) / 1000 * $price",
              "instant": true,
              "legendFormat": "Bezahlt",
              "refId": "A"
            }
          ]
        },
        {
          "type": "stat",
          "title": "Gespart heute",
          "description": "Selbst genutzte PV mal Strompreis — Strom, der sonst gekauft werden muesste. Selbst genutzt ist der Tagesertrag minus der Einspeisung, dieselbe Rechnung wie im Balken-Panel oben. Das ist Geld, das auf keiner Rechnung auftaucht, weil es nie ausgegeben wurde.",
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "gridPos": {"h": 4, "w": 6, "x": 6, "y": 26},
          "id": 22,
          "timeFrom": "now/d",
          "fieldConfig": {
            "defaults": {
              "unit": "currencyEUR",
              "decimals": 2,
              "color": {"mode": "fixed", "fixedColor": "#CF7526"},
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "textMode": "auto",
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}
          },
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
              "expr": "clamp_min(max(deye_production_today_kwh) - sum_over_time(clamp_min(-home:power_grid_import:watts, 0)[${__range_s}s:1m]) / 60 / 1000, 0) * $price",
              "instant": true,
              "legendFormat": "Gespart",
              "refId": "A"
            }
          ]
        },
        {
          "type": "stat",
          "title": "Entgangen heute",
          "description": "Eingespeiste Energie mal der Differenz aus Strompreis und Einspeiseverguetung. Die Verguetung steht auf 0, weil der Ueberschuss unverguetet ins Netz geht — die Zahl ist damit der volle Wert des Verschenkten: genau das Geld, das eine zeitlich verschobene Waschmaschine oder ein Akku eingefangen haette. Gruen wie die Einspeisung ueberall auf diesem Dashboard; die Farbe folgt der Messgroesse, nicht der Bewertung.",
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "gridPos": {"h": 4, "w": 6, "x": 12, "y": 26},
          "id": 23,
          "timeFrom": "now/d",
          "fieldConfig": {
            "defaults": {
              "unit": "currencyEUR",
              "decimals": 2,
              "color": {"mode": "fixed", "fixedColor": "#199e70"},
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "textMode": "auto",
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}
          },
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
              "expr": "sum_over_time(clamp_min(-home:power_grid_import:watts, 0)[${__range_s}s:1m]) / 60 / 1000 * ($price - $feedin)",
              "instant": true,
              "legendFormat": "Entgangen",
              "refId": "A"
            }
          ]
        },
