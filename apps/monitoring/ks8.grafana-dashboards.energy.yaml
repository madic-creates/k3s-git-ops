# Grafana dashboard for household electricity consumption and PV generation.
# Discovered automatically by the Grafana sidecar via the grafana_dashboard label.
#
# Data sources: fritzbox-exporter (grid import, via the FRITZ!Smart Energy plug)
# and mqtt2prometheus in the solar namespace (Deye SUN-M160G4 micro inverter).
# Derived series come from apps/monitoring/k8s.prometheusrule.energy.yaml.
#
# Series colours are fixed rather than themed because a Grafana dashboard JSON
# carries one palette for both light and dark. #CF7526 (generation), #4C7EE0
# (grid) and #199e70 (export) were validated together to pass the lightness
# band, chroma floor, CVD separation and contrast checks against both surfaces;
# the four-string palette below likewise, with the yellow relying on the table
# legend for label relief.
#
# The grid series is SIGNED: positive while importing, negative while exporting.
# Neither power panel may set `min: 0` or the export half is clipped away.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-energy
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  energy.json: |-
    {
      "annotations": {"list": []},
      "editable": true,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "type": "stat",
          "title": "Erzeugung",
          "description": "Aktuelle AC-Leistung des Deye-Wechselrichters.",
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0},
          "id": 1,
          "fieldConfig": {
            "defaults": {
              "unit": "watt",
              "decimals": 0,
              "color": {"mode": "fixed", "fixedColor": "#CF7526"},
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "textMode": "auto",
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}
          },
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
              "expr": "home:power_generation:watts",
              "legendFormat": "Erzeugung",
              "refId": "A"
            }
          ]
        },
        {
          "type": "stat",
          "title": "Netzleistung",
          "description": "Leistung am Netzanschluss, gemessen von der FRITZ!Smart Energy 250. Positiv = Bezug aus dem Netz, negativ = Einspeisung des PV-Überschusses. Die Steckdose misst vorzeichenbehaftet.",
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "gridPos": {"h": 4, "w": 6, "x": 6, "y": 0},
          "id": 2,
          "fieldConfig": {
            "defaults": {
              "unit": "watt",
              "decimals": 0,
              "color": {"mode": "fixed", "fixedColor": "#4C7EE0"},
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "textMode": "auto",
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}
          },
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
              "expr": "home:power_grid_import:watts",
              "legendFormat": "Netz",
              "refId": "A"
            }
          ]
        },
        {
          "type": "stat",
          "title": "Gesamtverbrauch",
          "description": "Netzleistung plus Erzeugung. Weil die Netzmessung vorzeichenbehaftet ist, stimmt das in beide Richtungen: bei Einspeisung ist der Netzwert negativ, sodass die Summe die tatsächliche Hauslast ergibt.",
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "gridPos": {"h": 4, "w": 6, "x": 12, "y": 0},
          "id": 3,
          "fieldConfig": {
            "defaults": {
              "unit": "watt",
              "decimals": 0,
              "color": {"mode": "fixed", "fixedColor": "text"},
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "textMode": "auto",
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}
          },
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
              "expr": "home:power_total:watts",
              "legendFormat": "Gesamtverbrauch",
              "refId": "A"
            }
          ]
        },
        {
          "type": "gauge",
          "title": "Autarkie",
          "description": "Anteil des Gesamtverbrauchs, der gerade aus eigener Erzeugung gedeckt wird. Die Kappung auf 100% steht zusätzlich in der Query, damit auch Samples richtig dargestellt werden, die vor der Korrektur der Recording Rule aufgezeichnet wurden — Rules ändern die Vergangenheit nicht.",
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "gridPos": {"h": 4, "w": 6, "x": 18, "y": 0},
          "id": 4,
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "decimals": 0,
              "min": 0,
              "max": 100,
              "color": {"mode": "fixed", "fixedColor": "#CF7526"},
              "thresholds": {"mode": "absolute", "steps": [{"color": "#CF7526", "value": null}]},
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "showThresholdLabels": false,
            "showThresholdMarkers": false,
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}
          },
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
              "expr": "clamp_max(home:autarky:ratio, 1) * 100",
              "legendFormat": "Autarkie",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Leistung: Erzeugung und Netz (gestapelt)",
          "description": "Die Stapelhöhe ist der Gesamtverbrauch, der gelbe Anteil die Eigendeckung.",
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "gridPos": {"h": 9, "w": 16, "x": 0, "y": 4},
          "id": 5,
          "fieldConfig": {
            "defaults": {
              "unit": "watt",
              "decimals": 0,
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "fillOpacity": 70,
                "showPoints": "never",
                "stacking": {"mode": "normal", "group": "A"},
                "axisSoftMin": 0
              }
            },
            "overrides": [
              {
                "matcher": {"id": "byName", "options": "Erzeugung"},
                "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "#CF7526"}}]
              },
              {
                "matcher": {"id": "byName", "options": "Netz"},
                "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "#4C7EE0"}}]
              }
            ]
          },
          "options": {
            "legend": {"displayMode": "table", "placement": "bottom", "showLegend": true, "calcs": ["lastNotNull", "max", "mean"]},
            "tooltip": {"mode": "multi", "sort": "desc"}
          },
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
              "expr": "home:power_generation:watts",
              "legendFormat": "Erzeugung",
              "refId": "A"
            },
            {
              "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
              "expr": "home:power_grid_import:watts",
              "legendFormat": "Netz",
              "refId": "B"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Autarkie",
          "description": "Eigendeckungsgrad über die Zeit.",
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "gridPos": {"h": 9, "w": 8, "x": 16, "y": 4},
          "id": 6,
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "decimals": 0,
              "min": 0,
              "max": 100,
              "color": {"mode": "fixed", "fixedColor": "#CF7526"},
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "fillOpacity": 25,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {"displayMode": "list", "placement": "bottom", "showLegend": false},
            "tooltip": {"mode": "single", "sort": "none"}
          },
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
              "expr": "clamp_max(home:autarky:ratio, 1) * 100",
              "legendFormat": "Autarkie",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Energie pro Tag",
          "description": "Ein Balken je Kalendertag der letzten 14 Tage. PV-Ertrag stammt aus der Tageszählung des Wechselrichters selbst (max_over_time), nicht aus dem rekonstruierten Zuwachs des Lebenszählers: nachts verschwinden die deye-Serien, weil der Logger abschaltet, und jede Messlücke am Tag würde den Zuwachs zu klein ausfallen lassen. Netzbezug muss den Zuwachs verwenden — die FRITZ-Steckdose führt keinen Tageszähler, läuft dafür aber durchgehend. Zeigt erst ab dem ersten abgeschlossenen Tag etwas, weil Grafana Range-Queries auf Vielfache des Schritts ausrichtet, bei Schritt 1d also auf Mitternacht.",
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "gridPos": {"h": 12, "w": 16, "x": 0, "y": 13},
          "id": 7,
          "interval": "1d",
          "timeFrom": "14d",
          "fieldConfig": {
            "defaults": {
              "unit": "kwatth",
              "decimals": 1,
              "custom": {
                "drawStyle": "bars",
                "barAlignment": 0,
                "barWidthFactor": 0.7,
                "lineWidth": 0,
                "fillOpacity": 90,
                "gradientMode": "none",
                "showPoints": "never",
                "axisSoftMin": 0
              }
            },
            "overrides": [
              {
                "matcher": {"id": "byName", "options": "PV-Ertrag"},
                "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "#CF7526"}}]
              },
              {
                "matcher": {"id": "byName", "options": "Netzbezug"},
                "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "#4C7EE0"}}]
              },
              {
                "matcher": {"id": "byName", "options": "Einspeisung"},
                "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "#199e70"}}]
              }
            ]
          },
          "options": {
            "legend": {"displayMode": "table", "placement": "bottom", "showLegend": true, "calcs": ["lastNotNull", "mean"]},
            "tooltip": {"mode": "multi", "sort": "desc"}
          },
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
              "expr": "max(max_over_time(deye_production_today_kwh[1d]))",
              "format": "time_series",
              "interval": "1d",
              "legendFormat": "PV-Ertrag",
              "refId": "A"
            },
            {
              "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
              "expr": "sum(increase(fritz_ha_multimeter_energy_Wh{ain=~\"16000.?0036823.*\"}[1d])) / 1000",
              "format": "time_series",
              "interval": "1d",
              "legendFormat": "Netzbezug",
              "refId": "B"
            },
            {
              "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
              "expr": "sum_over_time(clamp_min(-home:power_grid_import:watts, 0)[1d:1m]) / 60 / 1000",
              "format": "time_series",
              "interval": "1d",
              "legendFormat": "Einspeisung",
              "refId": "C"
            }
          ]
        },
        {
          "type": "stat",
          "title": "Ertrag heute",
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "gridPos": {"h": 4, "w": 8, "x": 16, "y": 13},
          "id": 8,
          "fieldConfig": {
            "defaults": {
              "unit": "kwatth",
              "decimals": 2,
              "color": {"mode": "fixed", "fixedColor": "#CF7526"},
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "textMode": "auto",
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}
          },
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
              "expr": "max(deye_production_today_kwh)",
              "legendFormat": "Heute",
              "refId": "A"
            }
          ]
        },
        {
          "type": "stat",
          "title": "Überschuss heute",
          "description": "Seit Mitternacht ins Netz eingespeiste Energie — minutenweise Integration der negativen Netzleistung. Eigener Zeitbereich \"now/d\", in Grafana dokumentiert als \"the day so far\". Abgeleitet aus home:power_grid_import:watts statt aus einer eigenen Export-Rule, weil diese Serie seit dem ersten Tag aufgezeichnet wird und der Wert damit auch rückwirkend stimmt.",
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "gridPos": {"h": 4, "w": 8, "x": 16, "y": 17},
          "id": 17,
          "timeFrom": "now/d",
          "fieldConfig": {
            "defaults": {
              "unit": "kwatth",
              "decimals": 2,
              "color": {"mode": "fixed", "fixedColor": "#199e70"},
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "textMode": "auto",
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}
          },
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
              "expr": "sum_over_time(clamp_min(-home:power_grid_import:watts, 0)[${__range_s}s:1m]) / 60 / 1000",
              "instant": true,
              "legendFormat": "Überschuss",
              "refId": "A"
            }
          ]
        },
        {
          "type": "stat",
          "title": "Ertrag gesamt",
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "gridPos": {"h": 4, "w": 8, "x": 16, "y": 21},
          "id": 9,
          "fieldConfig": {
            "defaults": {
              "unit": "kwatth",
              "decimals": 1,
              "color": {"mode": "fixed", "fixedColor": "text"},
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "textMode": "auto",
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}
          },
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
              "expr": "max(deye_production_total_kwh)",
              "legendFormat": "Gesamt",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Netzleistung gegen Erzeugung",
          "description": "Nicht gestapelt, direkt übereinandergelegt. Fällt die Netzkurve unter null, speist die Anlage ein — die Fläche unterhalb der Achse ist der Überschuss. Ein früherer Text behauptete hier, Einspeisung sei nicht messbar; das war falsch, die Steckdose misst vorzeichenbehaftet.",
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 25},
          "id": 10,
          "fieldConfig": {
            "defaults": {
              "unit": "watt",
              "decimals": 0,
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "fillOpacity": 0,
                "showPoints": "never"
              }
            },
            "overrides": [
              {
                "matcher": {"id": "byName", "options": "Erzeugung"},
                "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "#CF7526"}}]
              },
              {
                "matcher": {"id": "byName", "options": "Netz"},
                "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "#4C7EE0"}}]
              }
            ]
          },
          "options": {
            "legend": {"displayMode": "list", "placement": "bottom", "showLegend": true},
            "tooltip": {"mode": "multi", "sort": "desc"}
          },
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
              "expr": "home:power_generation:watts",
              "legendFormat": "Erzeugung",
              "refId": "A"
            },
            {
              "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
              "expr": "home:power_grid_import:watts",
              "legendFormat": "Netz",
              "refId": "B"
            }
          ]
        },
        {
          "type": "row",
          "title": "Anlagengesundheit",
          "collapsed": true,
          "gridPos": {"h": 1, "w": 24, "x": 0, "y": 33},
          "id": 100,
          "panels": [
            {
              "type": "timeseries",
              "title": "DC-Leistung je String",
              "description": "Ein dauerhaft abweichender String deutet auf Verschattung oder ein defektes Modul.",
              "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
              "gridPos": {"h": 8, "w": 12, "x": 0, "y": 34},
              "id": 11,
              "fieldConfig": {
                "defaults": {
                  "unit": "watt",
                  "decimals": 0,
                  "min": 0,
                  "custom": {
                    "drawStyle": "line",
                    "lineInterpolation": "smooth",
                    "lineWidth": 2,
                    "fillOpacity": 0,
                    "showPoints": "never"
                  }
                },
                "overrides": [
                  {"matcher": {"id": "byName", "options": "pv1"}, "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "#2a78d6"}}]},
                  {"matcher": {"id": "byName", "options": "pv2"}, "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "#d95926"}}]},
                  {"matcher": {"id": "byName", "options": "pv3"}, "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "#199e70"}}]},
                  {"matcher": {"id": "byName", "options": "pv4"}, "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "#c98500"}}]}
                ]
              },
              "options": {
                "legend": {"displayMode": "table", "placement": "right", "showLegend": true, "calcs": ["lastNotNull", "max"]},
                "tooltip": {"mode": "multi", "sort": "desc"}
              },
              "targets": [
                {
                  "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
                  "expr": "max by (string) (deye_dc_power_watts)",
                  "legendFormat": "{{string}}",
                  "refId": "A"
                }
              ]
            },
            {
              "type": "timeseries",
              "title": "DC-Spannung je String",
              "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
              "gridPos": {"h": 8, "w": 12, "x": 12, "y": 34},
              "id": 12,
              "fieldConfig": {
                "defaults": {
                  "unit": "volt",
                  "decimals": 1,
                  "custom": {
                    "drawStyle": "line",
                    "lineInterpolation": "smooth",
                    "lineWidth": 2,
                    "fillOpacity": 0,
                    "showPoints": "never"
                  }
                },
                "overrides": [
                  {"matcher": {"id": "byName", "options": "pv1"}, "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "#2a78d6"}}]},
                  {"matcher": {"id": "byName", "options": "pv2"}, "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "#d95926"}}]},
                  {"matcher": {"id": "byName", "options": "pv3"}, "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "#199e70"}}]},
                  {"matcher": {"id": "byName", "options": "pv4"}, "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "#c98500"}}]}
                ]
              },
              "options": {
                "legend": {"displayMode": "table", "placement": "right", "showLegend": true, "calcs": ["lastNotNull", "max"]},
                "tooltip": {"mode": "multi", "sort": "desc"}
              },
              "targets": [
                {
                  "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
                  "expr": "max by (string) (deye_dc_voltage_volts)",
                  "legendFormat": "{{string}}",
                  "refId": "A"
                }
              ]
            },
            {
              "type": "timeseries",
              "title": "Netzspannung am Wechselrichter",
              "description": "Bei zu hoher Netzspannung regelt der Wechselrichter ab — die häufigste Erklärung für unerwartet geringe Erzeugung.",
              "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
              "gridPos": {"h": 7, "w": 8, "x": 0, "y": 42},
              "id": 13,
              "fieldConfig": {
                "defaults": {
                  "unit": "volt",
                  "decimals": 1,
                  "color": {"mode": "fixed", "fixedColor": "#4C7EE0"},
                  "custom": {
                    "drawStyle": "line",
                    "lineInterpolation": "smooth",
                    "lineWidth": 2,
                    "fillOpacity": 0,
                    "showPoints": "never"
                  }
                },
                "overrides": []
              },
              "options": {
                "legend": {"displayMode": "list", "placement": "bottom", "showLegend": false},
                "tooltip": {"mode": "single", "sort": "none"}
              },
              "targets": [
                {
                  "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
                  "expr": "max(deye_ac_voltage_volts)",
                  "legendFormat": "Netzspannung",
                  "refId": "A"
                }
              ]
            },
            {
              "type": "timeseries",
              "title": "Netzfrequenz",
              "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
              "gridPos": {"h": 7, "w": 8, "x": 8, "y": 42},
              "id": 14,
              "fieldConfig": {
                "defaults": {
                  "unit": "hertz",
                  "decimals": 2,
                  "color": {"mode": "fixed", "fixedColor": "#4C7EE0"},
                  "custom": {
                    "drawStyle": "line",
                    "lineInterpolation": "smooth",
                    "lineWidth": 2,
                    "fillOpacity": 0,
                    "showPoints": "never"
                  }
                },
                "overrides": []
              },
              "options": {
                "legend": {"displayMode": "list", "placement": "bottom", "showLegend": false},
                "tooltip": {"mode": "single", "sort": "none"}
              },
              "targets": [
                {
                  "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
                  "expr": "max(deye_ac_frequency_hertz)",
                  "legendFormat": "Netzfrequenz",
                  "refId": "A"
                }
              ]
            },
            {
              "type": "timeseries",
              "title": "Wechselrichtertemperatur",
              "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
              "gridPos": {"h": 7, "w": 8, "x": 16, "y": 42},
              "id": 15,
              "fieldConfig": {
                "defaults": {
