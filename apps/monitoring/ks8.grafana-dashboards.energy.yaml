          "description": "Jeder String gegen sein EIGENES Modell; gestrichelt ist die Erwartung, nicht eine zweite Messung. Da das Modell die Bewölkung enthält, senkt ein trüber Tag beide Kurven gemeinsam — sie bleiben beieinander. Bekannt und kein Fehler: pv2 (Südwest) wird ab dem frühen Nachmittag von einem Baum beschattet und fällt dann unter seine Erwartung, während pv1 weiterläuft. Verdächtig ist dagegen ein Abfall, der sich nicht an die Tageszeit hält oder beide Strings trifft — dann Verschmutzung, Schnee oder ein defekter String. Ist-Werte sind DC je String, die Erwartung daher ebenfalls vor Wechselrichterverlusten. Rund um Sonnenauf- und -untergang ist der Vergleich nicht belastbar: die Einstrahlung wird alle 15 Minuten abgerufen und ist als Treppe bis zu 15 Minuten alt, während die echte Leistung dann schnell fällt — beide Kurven brechen dort gemeinsam ein, ohne dass etwas defekt wäre.",
