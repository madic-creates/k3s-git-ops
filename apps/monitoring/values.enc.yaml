prometheusOperator:
    revisionHistoryLimit: 2
# Override "for" / "severity" of built-in rules. Top-level key, not under defaultRules.
customRules:
    # Bump from default severity=info so the alert isn't suppressed by InfoInhibitor.
    CPUThrottlingHigh:
        severity: warning
alertmanager:
    enabled: true
    ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
            traefik.ingress.kubernetes.io/router.entrypoints: web239,websecure239
            traefik.ingress.kubernetes.io/router.tls: "true"
            traefik.ingress.kubernetes.io/router.middlewares: authelia-forwardauth-authelia@kubernetescrd
        hosts:
            - ENC[AES256_GCM,data:CIV36OOQ79fyqqBYwxXdKAWiNFWgOBItQwXDHM8+THZHVg==,iv:org4d+Iw49nWUrXggYEfKdGkul1Zs+cHfTOQrhSaQbs=,tag:4yZMD+g2awTitdf5WpHLew==,type:str]
        tls:
            - secretName: wildcard-cloudflare-production-02
              hosts:
                - ENC[AES256_GCM,data:ba3Qa4qYqkZ3Ij1uP1yumWGx3yOE7zQEr1WaCzARLKqhzw==,iv:OZGDgNKOMUjvRBwE2D5tn+YZ+qLLsjKIANGjpiBdoQM=,tag:qpAm9LFwPwS+krrij/E3gg==,type:str]
    alertmanagerSpec:
        # PVC configuration
        storage:
            volumeClaimTemplate:
                spec:
                    storageClassName: longhorn
                    accessModes:
                        - ReadWriteOnce
                    resources:
                        requests:
                            storage: 1Gi
    config:
        global:
            resolve_timeout: 5m
        inhibit_rules:
            - source_matchers:
                - severity = critical
              target_matchers:
                - severity =~ warning|info
              equal:
                - namespace
                - alertname
            - source_matchers:
                - severity = warning
              target_matchers:
                - severity = info
              equal:
                - namespace
                - alertname
            - source_matchers:
                - alertname = InfoInhibitor
              target_matchers:
                - severity = info
              equal:
                - namespace
            - target_matchers:
                - alertname = InfoInhibitor
        route:
            group_by:
                - namespace
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 1h
            receiver: ntfy
            routes:
                - receiver: "null"
                  matchers:
                    - alertname = "InfoInhibitor"
                # group_by override is load-bearing: gives the analyzer its own group
                # state so repeat_interval is per-alert. Without it, sibling alerts in
                # the same namespace would reset the analyzer's 12h cooldown.
                - receiver: claude-analyzer
                  matchers:
                    - severity =~ "warning|critical"
                  group_by:
                    - alertname
                    - namespace
                  group_wait: 30s
                  group_interval: 5m
                  repeat_interval: 12h
                  continue: true
                - receiver: ntfy
                  repeat_interval: 6h
                  matchers:
                    - alertname = "Watchdog"
                # Catch-all, must stay last: Alertmanager only falls back to the root
                # receiver when NO child route matches. Everything warning/critical is
                # already matched by the analyzer route above, so without this route
                # those alerts would never reach ntfy.
                - receiver: ntfy
        receivers:
            - name: "null"
            - name: claude-analyzer
              webhook_configs:
                - url: ENC[AES256_GCM,data:ymJ/xaHYjMTODkOyzDBNHR/FkW+ETvE9e3y2N3+zb/wIgOa++O7cPGMrvblsFXacPc7gHsLS0s9uJtuL5imXLALqR+RVTI4qB8yKoWRA+RQd,iv:ENZ/Li/rOF+GbYvEJda6SoorDZei4Yn2mAAzGheyIUo=,tag:n/f71GtLBwbcbox8DYskTg==,type:str]
                  send_resolved: false
                  http_config:
                    authorization:
                        type: Bearer
                        credentials: ENC[AES256_GCM,data:tcpXu7azvlSzphBz6mQfW7NHzkPZYcOtpHliecg9ePakRwgu1TEuQWCcxldM7v21P10i74JW5KywxR+MeQsGeQ==,iv:SVJ/dwfBwtLKdKitQ3Lb2ED6MoUGg7iudVP883Diz7k=,tag:2AsqGOR3zIToHhDRx5c7vA==,type:str]
            - name: ntfy
              webhook_configs:
                - url: ENC[AES256_GCM,data:gJ7/jmTzcl9UMPVsmZT1ctg75DFSYKEXDJzmkRIjNMO8DTfDdrk0E8FXe/e1l5sToc/gnQ/u/AHRtA==,iv:ATJ5YDRW3rEbFm4uWB39p/gemDpuSANZYYj+lNfZtqM=,tag:tpAbrnFnQeGt++eKy8IwIw==,type:str]
                  http_config:
                    basic_auth:
                        username: ENC[AES256_GCM,data:UJDsaMsH3GZdpidhyBVzJIClu17I8Rnv,iv:qXcdLVOdmQQL2JjS7hPQt/1nlecFvfBqrt9nkjgW64k=,tag:46YTrRVJxtSv/nOvMqArFQ==,type:str]
                        password: ENC[AES256_GCM,data:2BhTdHfbOxeLwMnOVnELrniqcL2ooAyI,iv:2ByUQ/O1NTCaIQ/g1HcZ5o23Tr2UV5T2R+VPIuBNgIs=,tag:MgVaESZzRYDsAF30sGYbOA==,type:str]
        templates:
            - /etc/alertmanager/config/*.tmpl
prometheus:
    prometheusSpec:
        retention: 45d
        retentionSize: 25GB
        # By default, Prometheus only discovers PodMonitors and ServiceMonitors within its namespace.
        # Settings this to false disables the behaviour.
        podMonitorSelectorNilUsesHelmValues: false
        serviceMonitorSelectorNilUsesHelmValues: false
        #containers:
        #  - name: prometheus
        #    startupProbe:
        #      failureThreshold: 500
        # Resources request and limits
        resources:
            requests:
                cpu: 500m
                memory: 2Gi
            limits:
                cpu: 1000m
                memory: 6Gi
        # PVC configuration
        storageSpec:
            volumeClaimTemplate:
                spec:
                    storageClassName: longhorn
                    accessModes:
                        - ReadWriteOnce
                    resources:
                        requests:
                            storage: 35Gi
# In K3S, these services are not deployed as pods but are part of the k3s binary
# Do not use the vip because there are node specific metrics
kubeEtcd:
    enabled: true
    endpoints:
        - 192.168.1.21
        - 192.168.1.22
        - 192.168.1.23
kubeControllerManager:
    enabled: true
    endpoints:
        - 192.168.1.21
        - 192.168.1.22
        - 192.168.1.23
    service:
        enabled: true
        port: 10257
        targetPort: 10257
    serviceMonitor:
        enabled: true
        https: true
        insecureSkipVerify: true
kubeScheduler:
    enabled: true
    endpoints:
        - 192.168.1.21
        - 192.168.1.22
        - 192.168.1.23
    service:
        enabled: true
        port: 10259
        targetPort: 10259
    serviceMonitor:
        enabled: true
        https: true
        insecureSkipVerify: true
kubeProxy:
    enabled: false
    endpoints:
        - 192.168.1.21
        - 192.168.1.22
        - 192.168.1.23
    service:
        enabled: true
        port: 10249
        targetPort: 10249
