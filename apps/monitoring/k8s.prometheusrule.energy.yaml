# Derived series for the energy dashboard.
#
# Measurement topology: the FRITZ!Smart Energy 250 reports **signed** power —
# positive while the house draws from the grid, negative while PV surplus is
# exported into it. Measured, not assumed: over two days 122 of 1672 samples
# were negative, minimum -202 W.
#
# An earlier version of this file claimed the plug measured magnitude only and
# that total load and self-sufficiency were overstated during export. That was
# wrong and never verified. Because the grid value carries a sign,
# grid + generation is the true household load in both directions and needs no
# correction.
#
# `home:power_grid_import:watts` keeps its name for history continuity even
# though it is signed. The exported share is `clamp_min(-that, 0)`.
#
# Note that recording rules never rewrite the past: the samples this file
# produced before the clamp_max below was added still exceed 100%, which is why
# the dashboard caps at query time as well.
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: energy
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: energy.rules
      rules:
        # Pinned to the AIN of the FRITZ!Smart Energy 250 that measures grid
        # import, so that a second smart plug paired later cannot be silently
        # summed into household consumption. The regex tolerates both the
        # device AIN and its "-1" sub-unit (only the latter carries the
        # powermeter) as well as either spelling of the space in the AIN.
        # If the plug is ever re-paired its AIN changes and this selector goes
        # empty — EnergyGridImportMissing below catches exactly that.
        - record: home:power_grid_import:watts
          expr: sum(fritz_ha_multimeter_power_W{ain=~"16000.?0036823.*"})

        # `or vector(0)` matters: the inverter powers down at night and its
        # series disappear, which would otherwise make total load vanish too.
        - record: home:power_generation:watts
          expr: sum(deye_ac_active_power_watts) or vector(0)

        - record: home:power_total:watts
          expr: home:power_grid_import:watts + home:power_generation:watts

        # Exported surplus is deliberately NOT recorded as its own rule. It is
        # `clamp_min(-home:power_grid_import:watts, 0)` and the dashboard spells
        # that out inline, because a rule added today would carry no history and
        # the surplus panels have to render past days.
        #
        # clamp_min guards the division when the house draws nothing at all.
        # clamp_max caps the result at 1: you cannot cover more than 100% of
        # your own consumption. Without the cap the ratio runs away as load
        # approaches zero — 537% measured over two days, and 105% is already
        # visible on an ordinary sunny afternoon. Whatever exceeds 100% is not
        # self-sufficiency but surplus, and belongs in home:power_export:watts.
        - record: home:autarky:ratio
          expr: |
            clamp_max(
              home:power_generation:watts
                / clamp_min(home:power_total:watts, 1),
              1
            )

        # --- Solar irradiance reference ---------------------------------
        #
        # Open-Meteo supplies the irradiance actually falling on each string,
        # which turns raw generation into a judgeable number: 250 W at 15:00
        # is either an overcast afternoon or a failing array, and the DC
        # per-string values cannot tell those apart when both strings are
        # affected equally (soiling, snow, curtailment, degradation).
        #
        # The two strings face nearly opposite directions -- pv1 north-east,
        # pv2 south-west, both at 40 degrees -- so they get separate
        # irradiance series and a single averaged orientation would
        # misrepresent both. Peak power is exported as a metric rather than
        # written here as a literal, so adding a third panel later needs no
        # rule change.
        #
        # max by (string) is not optional: every exporter pod restart creates
        # a new series, and a query spanning a day would otherwise return one
        # series per pod that ever existed in that window.
        - record: solar:ideal_power:watts
          expr: |
            sum(
              max by (string) (solar_irradiance_tilted_wm2) / 1000
                * on (string) group_left
                  max by (string) (solar_array_peak_power_watts)
            )

        # The single performance-ratio constant in the whole design.
        #
        # PROVISIONAL. Calibrated from one day (2026-09-07): 4.56 kWh modelled
        # against roughly 3.1 kWh actually generated. That is a believable
        # figure for a fixed, steeply mounted split-orientation array, but one
        # day is not evidence -- revisit after several clear days and correct
        # it here. It absorbs everything not modelled explicitly: temperature
        # coefficient, angle-of-incidence losses, shading, inverter efficiency.
        - record: solar:expected_power:watts
          expr: solar:ideal_power:watts * 0.68

        # Why this ratio is a health signal rather than a weather signal:
        # Open-Meteo's tilted irradiance already accounts for cloud cover
        # (measured: 448 W/m2 at 4% cloud, heavily suppressed at 100%), so an
        # overcast day lowers numerator and denominator together and the ratio
        # stays roughly flat. A DROP therefore points at the array, not the sky.
        #
        # clamp_min guards the division at night, when the ceiling is zero.
        - record: solar:performance_ratio
          expr: |
            home:power_generation:watts
              / clamp_min(solar:ideal_power:watts, 1)

    - name: energy.alerts
      rules:
        # Both exporters are alerted on `up`, not on metric absence: the
        # inverter legitimately stops reporting every night, so absence of
        # deye_* series is normal and would produce a nightly false alarm.
        - alert: SolarExporterDown
          expr: up{job="mqtt2prometheus"} == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Solar metrics exporter is down"
            description: "mqtt2prometheus in namespace solar has been unreachable for 10 minutes. PV generation is missing from the energy dashboard, which also makes household total load read low."

        - alert: FritzboxExporterDown
          expr: up{job="fritzbox-exporter"} == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "FRITZ!Box exporter is down"
            description: "fritzbox-exporter has been unreachable for 10 minutes. Grid import is missing, so household total load and self-sufficiency on the energy dashboard are wrong."

        # Guard for the pinned AIN in home:power_grid_import:watts above. The
        # exporter being up while the selector matches nothing means the plug
        # was re-paired, renamed away, or removed — without this the dashboard
        # would quietly show PV generation only and call it the whole house.
        - alert: EnergyGridImportMissing
          expr: |
            absent(fritz_ha_multimeter_power_W{ain=~"16000.?0036823.*"})
            and on() (up{job="fritzbox-exporter"} == 1)
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Grid import metric is missing while the FRITZ!Box exporter is up"
            description: "No fritz_ha_multimeter_power_W series matches the AIN pinned in apps/monitoring/k8s.prometheusrule.energy.yaml, but the exporter is scraping fine. The smart plug was most likely re-paired and now has a different AIN. Until the selector is updated, household total load and self-sufficiency on the energy dashboard show generation only."

        # Deliberately hard to trigger. 0.40 sits between the 0.68 baseline and
        # the ~0.34 that losing one of two strings would produce. The
        # ideal_power guard keeps dawn, dusk and deep overcast out, where a
        # small absolute error produces a wild ratio, and `for: 2h` keeps
        # passing weather out.
        #
        # PROVISIONAL, for the same reason as the 0.68 above: both numbers come
        # from a single day and must be re-evaluated once a few weeks of
        # solar:performance_ratio history exists.
        - alert: SolarArrayUnderperforming
          expr: |
            solar:performance_ratio < 0.40
            and solar:ideal_power:watts > 300
          for: 2h
          labels:
            severity: warning
          annotations:
            summary: "PV array is producing far below the irradiance reference"
            description: "Measured generation has been under 40% of the modelled clear-reference for two hours while irradiance was high. Because the model already accounts for cloud cover, this points at the array rather than the weather: check for soiling, snow, shading, a tripped string or curtailment."

        # Unlike the inverter, this exporter has no legitimate nightly outage,
        # so `up` may be alerted on with a short window.
        - alert: SolarIrradianceExporterDown
          expr: up{job="openmeteo-exporter"} == 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Open-Meteo irradiance exporter is down"
            description: "openmeteo-exporter in namespace solar has been unreachable for 30 minutes. The expected-yield reference and solar:performance_ratio are missing, so PV underperformance can no longer be detected."

        # Complementary to the alert above, not redundant: that one catches a
        # dead pod, this one catches a HEALTHY pod that has lost its upstream
        # and is quietly serving hours-old values. The exporter keeps its last
        # good reading on purpose so a transient API error does not take the
        # reference offline -- this is what makes that safe.
        #
        # max() because each exporter pod restart creates a new series, and the
        # abandoned ones would otherwise stay permanently stale and fire.
        - alert: SolarIrradianceStale
          expr: |
            time() - max(solar_openmeteo_last_success_timestamp_seconds) > 3600
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Irradiance data is stale"
            description: "The exporter is running but has not completed a successful Open-Meteo poll for over an hour. It is still serving its last good reading, so the expected-yield reference on the energy dashboard is out of date rather than absent. Check egress to api.open-meteo.com."
