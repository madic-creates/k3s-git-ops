# Derived series for the energy dashboard.
#
# Measurement topology: the FRITZ!Smart Energy 250 reports **signed** power —
# positive while the house draws from the grid, negative while PV surplus is
# exported into it. Measured, not assumed: over two days 122 of 1672 samples
# were negative, minimum -202 W.
#
# An earlier version of this file claimed the plug measured magnitude only and
# that total load and self-sufficiency were overstated during export. That was
# wrong and never verified. Because the grid value carries a sign,
# grid + generation is the true household load in both directions and needs no
# correction.
#
# `home:power_grid_import:watts` keeps its name for history continuity even
# though it is signed. The exported share is `clamp_min(-that, 0)`.
#
# Note that recording rules never rewrite the past: the samples this file
# produced before the clamp_max below was added still exceed 100%, which is why
# the dashboard caps at query time as well.
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: energy
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: energy.rules
      rules:
        # Pinned to the AIN of the FRITZ!Smart Energy 250 that measures grid
        # import, so that a second smart plug paired later cannot be silently
        # summed into household consumption. The regex tolerates both the
        # device AIN and its "-1" sub-unit (only the latter carries the
        # powermeter) as well as either spelling of the space in the AIN.
        # If the plug is ever re-paired its AIN changes and this selector goes
        # empty — EnergyGridImportMissing below catches exactly that.
        - record: home:power_grid_import:watts
          expr: sum(fritz_ha_multimeter_power_W{ain=~"16000.?0036823.*"})

        # `or vector(0)` matters: the inverter powers down at night and its
        # series disappear, which would otherwise make total load vanish too.
        - record: home:power_generation:watts
          expr: sum(deye_ac_active_power_watts) or vector(0)

        - record: home:power_total:watts
          expr: home:power_grid_import:watts + home:power_generation:watts

        # Exported surplus is deliberately NOT recorded as its own rule. It is
        # `clamp_min(-home:power_grid_import:watts, 0)` and the dashboard spells
        # that out inline, because a rule added today would carry no history and
        # the surplus panels have to render past days.
        #
        # clamp_min guards the division when the house draws nothing at all.
        # clamp_max caps the result at 1: you cannot cover more than 100% of
        # your own consumption. Without the cap the ratio runs away as load
        # approaches zero — 537% measured over two days, and 105% is already
        # visible on an ordinary sunny afternoon. Whatever exceeds 100% is not
        # self-sufficiency but surplus, and belongs in home:power_export:watts.
        - record: home:autarky:ratio
          expr: |
            clamp_max(
              home:power_generation:watts
                / clamp_min(home:power_total:watts, 1),
              1
            )

        # --- Per-appliance measurement ----------------------------------
        #
        # Shelly Plug M Gen3 smart plugs meter individual appliances. These two
        # rules turn them into a share-of-total view: what is actually measured,
        # and what is left over.
        #
        # `max by (mac)` is not optional, and the reason is the same one that
        # cost a debugging round on the PV panels: every label the exporter
        # attaches -- address, mac, name, firmwareVersion, type -- rides on each
        # series, and an exporter pod restart adds a new `pod`/`instance` pair.
        # Any of those events forks one appliance into two series, and a plain
        # sum() would count that appliance twice for the length of the overlap.
        #
        # The MAC is the only label that no event changes. `name` was used
        # before and is wrong: it comes from the device and changes whenever
        # someone renames the plug in the Shelly app. That happened on
        # 2026-09-11 -- the fourth plug went from "Kuehlschrank" to
        # "Tiefkuehlschrank" -- and the very next plug to arrive was a real
        # fridge named "Kuehlschrank", so by name the freezer's first hours and
        # the new fridge collapse into one series. Two plugs that happen to
        # share a name would merge the same way. `address` survives renames
        # but not a new DHCP lease. The MAC survives all three.
        #
        # `or vector(0)` keeps the remainder honest while no plug reports at
        # all: without it the subtraction below returns empty rather than the
        # full household load.
        - record: home:power_measured:watts
          expr: |
            sum(max by (mac) (shelly_meter_power_current_watts)) or vector(0)

        # The share of household load NOT explained by a metered appliance.
        #
        # clamp_min is load-bearing: the plugs and the FRITZ meter are sampled
        # independently, so timing offsets alone produce briefly negative
        # differences. It is not masking a modelling error -- the grid value is
        # signed, so home:power_total:watts is the true load in both directions
        # (see the header of this file).
        #
        # Expect this to be large while only some appliances are metered. That
        # is the panel doing its job, not a fault.
        - record: home:power_unaccounted:watts
          expr: |
            clamp_min(
              home:power_total:watts - home:power_measured:watts,
              0
            )

        # --- Solar irradiance reference ---------------------------------
        #
        # Open-Meteo supplies the irradiance actually falling on each string,
        # which turns raw generation into a judgeable number: 250 W at 15:00
        # is either an overcast afternoon or a failing array, and the DC
        # per-string values cannot tell those apart when both strings are
        # affected equally (soiling, snow, curtailment, degradation).
        #
        # The two strings face nearly opposite directions -- pv1 south-west,
        # pv2 north-east, both at 16 degrees -- so they get separate
        # irradiance series and a single averaged orientation would
        # misrepresent both. Peak power is exported as a metric rather than
        # written here as a literal, so adding a third panel later needs no
        # rule change.
        #
        # max by (string) is not optional: every exporter pod restart creates
        # a new series, and a query spanning a day would otherwise return one
        # series per pod that ever existed in that window.
        - record: solar:ideal_power:watts
          expr: |
            sum(
              max by (string) (solar_irradiance_tilted_wm2) / 1000
                * on (string) group_left
                  max by (string) (solar_array_peak_power_watts)
            )

        # Why this ratio is a health signal rather than a weather signal:
        # Open-Meteo's tilted irradiance already accounts for cloud cover
        # (measured: 448 W/m2 at 4% cloud, heavily suppressed at 100%), so an
        # overcast day lowers numerator and denominator together and the ratio
        # stays roughly flat. A DROP therefore points at the array, not the sky.
        #
        # clamp_min guards the division at night, when the ceiling is zero.
        - record: solar:performance_ratio
          expr: |
            home:power_generation:watts
              / clamp_min(solar:ideal_power:watts, 1)

        # --- Per-string reference ---------------------------------------
        #
        # The aggregate comparison above cannot be read on its own, because
        # pv1 (south-west) is shaded by a tree from the late afternoon. That
        # is a permanent, expected condition: the aggregate ratio dips daily
        # without anything being wrong, which would train the reader to
        # ignore the panel and would make an aggregate alert fire every day.
        #
        # Per string, the shading becomes both visible and attributable: pv2
        # keeps tracking its own model while pv1 departs from its own, at a
        # time of day that matches the tree. Measured 2026-09-08: pv1 runs
        # 0.85 at 15:00, 0.71 at 16:00, then 0.42 and 0.15, while pv2 is still
        # at 0.76 at 17:00. A fault looks different -- it does not respect the
        # clock, and it usually affects both strings.
        #
        # NOTE ON BASIS: these use DC power per string, because there is no
        # per-string AC value; the aggregate rules above use AC. A DC ratio
        # excludes inverter conversion loss and the inverter's own draw, so it
        # reads slightly HIGHER than the aggregate ratio for the same
        # conditions -- by the inverter's 0.96, measured below.
        - record: solar:ideal_power_by_string:watts
          expr: |
            max by (string) (solar_irradiance_tilted_wm2) / 1000
              * on (string) group_left
                max by (string) (solar_array_peak_power_watts)

        # One performance-ratio constant PER STRING, measured on clear days.
        # Each absorbs everything not modelled explicitly -- temperature
        # coefficient, angle-of-incidence loss, soiling, wiring.
        #
        # Measured in the unshaded window 10:00-12:59 UTC, 5-minute samples
        # with forecast cloud cover <= 15 %:
        #
        #   2026-10-06 (clear all day)  pv1 0.94  pv2 0.71
        #   2026-10-07 (clear morning)  pv1 0.94  pv2 0.81
        #   2026-09-08 (partly cloudy)  pv1 0.85 at its unshaded peak, pv2 0.79
        #
        # pv1 is stable; pv2 is not a flat ratio but slides from ~0.81 at
        # 10 UTC to ~0.66 at 12:45 UTC as the sun moves away from its
        # north-east face, so its constant is a midday average, not a fit.
        # The two differ by far more than the noise, which is why the single
        # 0.75 of the previous revision is gone: it drew pv1's expected line
        # about 20 % too low on every clear day.
        #
        # The values are cold-season DC ratios. Panels lose roughly 0.35 %
        # per kelvin, so summer reads a few percent lower -- pv1 0.90 is set
        # between the October 0.94 and the September 0.85 for that reason,
        # and pv2 0.76 between its October midday range and September 0.79.
        #
        # Ratios ABOVE 1.0 do occur, but only in hours the forecast calls
        # overcast while the sun is actually out (2026-10-12 and 10-15:
        # pv1 1.1-1.4 at 80-99 % forecast cloud). That is forecast error in the
        # denominator, not a geometry fault: no clear-sky hour exceeds 1.0.
        #
        # Strings not listed here (pv3/pv4 exist on the inverter but are
        # unused) get no expected value, deliberately.
        - record: solar:expected_power_by_string:watts
          expr: |
            solar:ideal_power_by_string:watts{string="pv1"} * 0.90
            or solar:ideal_power_by_string:watts{string="pv2"} * 0.76

        # The aggregate is compared with AC generation, so the DC per-string
        # expectation is converted with the measured inverter efficiency:
        # AC / (pv1 + pv2 DC) had a median of 0.96 between 10:00 and 12:59 UTC
        # on both 2026-10-06 and 2026-10-07.
        - record: solar:expected_power:watts
          expr: sum(solar:expected_power_by_string:watts) * 0.96

        - record: solar:performance_ratio_by_string
          expr: |
            max by (string) (deye_dc_power_watts)
              / clamp_min(solar:ideal_power_by_string:watts, 1)

    - name: energy.alerts
      rules:
        # Both exporters are alerted on `up`, not on metric absence: the
        # inverter legitimately stops reporting every night, so absence of
        # deye_* series is normal and would produce a nightly false alarm.
        - alert: SolarExporterDown
          expr: up{job="mqtt2prometheus"} == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Solar metrics exporter is down"
            description: "mqtt2prometheus in namespace solar has been unreachable for 10 minutes. PV generation is missing from the energy dashboard, which also makes household total load read low."

        - alert: FritzboxExporterDown
          expr: up{job="fritzbox-exporter"} == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "FRITZ!Box exporter is down"
            description: "fritzbox-exporter has been unreachable for 10 minutes. Grid import is missing, so household total load and self-sufficiency on the energy dashboard are wrong."

        # Guard for the pinned AIN in home:power_grid_import:watts above. The
        # exporter being up while the selector matches nothing means the plug
        # was re-paired, renamed away, or removed — without this the dashboard
        # would quietly show PV generation only and call it the whole house.
        - alert: EnergyGridImportMissing
          expr: |
            absent(fritz_ha_multimeter_power_W{ain=~"16000.?0036823.*"})
            and on() (up{job="fritzbox-exporter"} == 1)
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Grid import metric is missing while the FRITZ!Box exporter is up"
            description: "No fritz_ha_multimeter_power_W series matches the AIN pinned in apps/monitoring/k8s.prometheusrule.energy.yaml, but the exporter is scraping fine. The smart plug was most likely re-paired and now has a different AIN. Until the selector is updated, household total load and self-sufficiency on the energy dashboard show generation only."

        # Per string, and only in the window where NEITHER string is shaded.
        #
        # pv1 (south-west) is shaded by a tree in the afternoon, and with the
        # low autumn sun BOTH strings are shaded in the morning too, so an
        # alert spanning the whole day would fire on shadows every day.
        #
        # `hour()` is UTC. The window 10..12 UTC is 12:00-14:59 local in summer
        # and 11:00-13:59 in winter. It is the shade-free window measured on
        # the clear day 2026-10-06 (5-minute samples, 0 % forecast cloud):
        #
        #   08:00-09:15 UTC  pv1 0.30-0.41, pv2 0.27-0.40   morning shade
        #   09:30-09:45 UTC  0.46-0.57, still climbing
        #   10:00-12:45 UTC  pv1 ~0.93, pv2 0.84 -> 0.61    unshaded
        #   13:00-13:45 UTC  both fall 0.80 -> 0.39         afternoon shade
        #
        # 2026-10-12 shows the same edges (pv1 0.94 at 12:45, 0.58 at 13:00).
        # The previous 7..12 window came from September, when the sun stood
        # higher; replayed over 2026-10-05..10-15 it let clear-sky morning
        # shade hold pv2 under 0.40 for 50 consecutive minutes -- under the
        # `for: 2h`, but with winter shadows growing longer every week. In
        # winter the shade-free span narrows from both ends, so if this alert
        # ever fires on a healthy string, look at the edge hours first.
        #
        # THRESHOLD 0.40, now checked rather than provisional: replaying this
        # exact expression over 2026-10-05..10-15 (eleven days, three mostly
        # clear, three fully overcast), the longest unbroken run of a healthy
        # string under 0.40 is 15 minutes, against the 2 hours `for` demands.
        # Even 0.60 never stays under for more than 25 minutes, so there is
        # room to tighten later. It is kept at 0.40 because pv2's ratio
        # slides to ~0.6 by 12:45 UTC on a clear day and the winter sun will
        # push that lower.
        # Clear-day medians in the window are pv1 0.94 and pv2 0.74, so 0.40
        # is under half of normal on either string. It is compared against the
        # raw DC-based ratio, not the per-string calibrated expectation.
        #
        # The ideal_power guard keeps out deep overcast, where a small absolute
        # error produces a wild ratio; `for: 2h` keeps out passing weather.
        - alert: SolarStringUnderperforming
          expr: |
            solar:performance_ratio_by_string < 0.40
            and solar:ideal_power_by_string:watts > 150
            and on () (hour() > 9 < 13)
          for: 2h
          labels:
            severity: warning
          annotations:
            summary: "PV string {{ $labels.string }} is producing far below its irradiance reference"
            description: "String {{ $labels.string }} has been under 40% of its modelled clear-reference for two hours during the unshaded midday window (10-12 UTC), while irradiance on that string was high. Because the model already accounts for cloud cover and the known morning and afternoon shading is excluded by the time window, this points at the panel rather than the weather: check for soiling, bird droppings, snow, new vegetation growth or a failed string. Measured clear-day baseline (October 2026): about 0.94 for pv1, 0.74 for pv2."

        # The plugs stay powered around the clock, so this exporter has no
        # legitimate outage window and `up` may be alerted on directly.
        - alert: ShellyExporterDown
          expr: up{job="shelly-exporter"} == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Shelly plug exporter is down"
            description: "shelly-exporter has been unreachable for 10 minutes. Per-appliance consumption is missing from the energy dashboard, which makes the unaccounted remainder read as the entire household load."

        # Complementary to the alert above, and not redundant: that one catches
        # a dead pod, this one catches a HEALTHY pod that reports no appliances.
        # Two real failure modes produce exactly that, and neither shows up as a
        # failed scrape:
        #
        #  - Wrong or missing device password. Only Shelly.GetDeviceInfo is
        #    public on these plugs; every data endpoint answers 401. Measured:
        #    the exporter then serves 2 info series instead of 54, and the
        #    scrape still succeeds.
        #  - A plug that moved to a different IP. The CiliumNetworkPolicy
        #    matches /32 CIDRs, so a lost DHCP reservation silently blocks
        #    egress to that one plug while the others keep reporting.
        #
        # The threshold is the number of plugs in SHELLY_GEN2DEVICES_HOSTS in
        # apps/monitoring-shelly-exporter/k8s.deployment.yaml. Raise it in the
        # same commit that adds a plug, or the new plug is not actually
        # supervised -- this is the same pin-and-guard pattern as the AIN in
        # home:power_grid_import:watts above.
        #
        # Counted per MAC, not per name, for the reason given at
        # home:power_measured:watts: by name, a rename or two plugs sharing a
        # name would count one device twice or two devices once.
        #
        # `or vector(0)` is required, not defensive: count() over an empty
        # vector returns EMPTY, not 0, so without it the total-failure case
        # (nothing reporting at all) would never fire. The `up == 1` guard
        # keeps this quiet while ShellyExporterDown already covers a dead pod.
        - alert: ShellyExporterDeviceMissing
          expr: |
            (
              count(count by (mac) (shelly_meter_power_current_watts))
              or vector(0)
            ) < 11
            and on() (up{job="shelly-exporter"} == 1)
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Fewer Shelly plugs are reporting than are configured"
            description: "The Shelly exporter is scraping fine but fewer appliances report power than are configured in SHELLY_GEN2DEVICES_HOSTS. Most likely the device password is wrong (every Shelly data endpoint returns 401 while the public device-info endpoint keeps working, so the scrape still looks healthy), or a plug lost its DHCP reservation and is now blocked by the /32 egress rule in apps/monitoring-shelly-exporter/k8s.np.shelly-exporter.yaml. Until it is fixed, the affected appliance silently moves into the unaccounted remainder on the energy dashboard."

        # Unlike the inverter, this exporter has no legitimate nightly outage,
        # so `up` may be alerted on with a short window.
        - alert: SolarIrradianceExporterDown
          expr: up{job="openmeteo-exporter"} == 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Open-Meteo irradiance exporter is down"
            description: "openmeteo-exporter in namespace solar has been unreachable for 30 minutes. The expected-yield reference and solar:performance_ratio are missing, so PV underperformance can no longer be detected."

        # Complementary to the alert above, not redundant: that one catches a
        # dead pod, this one catches a HEALTHY pod that has lost its upstream
        # and is quietly serving hours-old values. The exporter keeps its last
        # good reading on purpose so a transient API error does not take the
        # reference offline -- this is what makes that safe.
        #
        # max() because each exporter pod restart creates a new series, and the
        # abandoned ones would otherwise stay permanently stale and fire.
        - alert: SolarIrradianceStale
          expr: |
            time() - max(solar_openmeteo_last_success_timestamp_seconds) > 3600
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Irradiance data is stale"
            description: "The exporter is running but has not completed a successful Open-Meteo poll for over an hour. It is still serving its last good reading, so the expected-yield reference on the energy dashboard is out of date rather than absent. Check egress to api.open-meteo.com."
