---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mcp-memory-service
  namespace: mcp-memory
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: mcp-memory-service
  ingress:
    # Traefik forwards client traffic (internal ingress).
    - fromEndpoints:
        - matchLabels:
            k8s:app.kubernetes.io/instance: traefik-kube-system
            k8s:io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    # kubelet health probes.
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
  egress:
    # DNS via CoreDNS.
    - toEndpoints:
        - matchLabels:
            k8s:io.cilium.k8s.namespace.labels.kubernetes.io/metadata.name: kube-system
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # Embedding model download from Hugging Face on first start.
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
