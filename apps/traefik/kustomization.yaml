---
resources:
  - traefik-config.yaml
  - namespace.yaml
  #- k8s.gateway.yaml
  - k8s.np.traefik.yaml
  - k8s.serverstransport.yaml
  # Gateway API CRDs are no longer shipped with the Traefik chart since v40.
  # Traefik v3.7 requires at least v1.5 (TLSRoute v1).
  - https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.6.1/standard-install.yaml

patches:
  # httproutes alone is ~240 KB; server-side apply avoids hitting the 256 KB
  # last-applied-configuration annotation limit of client-side apply.
  - target:
      group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: .*\.gateway\.networking\.k8s\.io
    patch: |-
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1sync-options
        value: ServerSideApply=true

commonAnnotations:
  argocd.argoproj.io/sync-wave: "3"

helmCharts:
  - name: traefik
    repo: https://traefik.github.io/charts
    version: 41.7.1
    releaseName: traefik
    namespace: kube-system
    includeCRDs: true
    valuesInline:
      core:
        defaultRuleSyntax: v2
        # Disable routers with conflicting TLS options instead of silently
        # falling back to the default TLS options (GHSA-g55h-rg46-x9c5).
        strictTLSOptions: true
      deployment:
        kind: DaemonSet
      # Since chart v40, type/ipFamilyPolicy etc. must be set under service.spec
      service:
        annotations:
          kube-vip.io/loadbalancerIPs: "192.168.1.231"
        spec:
          type: LoadBalancer
          ipFamilyPolicy: PreferDualStack
          loadBalancerIP: "192.168.1.231"
          externalTrafficPolicy: Local
        additionalServices:
          vip239:
            annotations:
              kube-vip.io/loadbalancerIPs: "192.168.1.239"
            spec:
              type: LoadBalancer
              loadBalancerIP: "192.168.1.239"
              externalTrafficPolicy: Local
      ports:
        web:
          port: 8000
          expose:
            default: true
          exposedPort: 80
          nodePort: 30080
          http:
            # Drop headers whose name aliases another one (e.g. Remote_User for
            # Remote-User) so clients cannot spoof Authelia ForwardAuth headers.
            aliasHeadersStrategy: delete
        websecure:
          port: 8443
          expose:
            default: true
          exposedPort: 443
          nodePort: 30443
          http:
            aliasHeadersStrategy: delete
            tls:
              enabled: true
        web239:
          port: 8010
          expose:
            default: false
            vip239: true
          exposedPort: 80
          http:
            aliasHeadersStrategy: delete
        websecure239:
          port: 8444
          expose:
            default: false
            vip239: true
          exposedPort: 443
          http:
            aliasHeadersStrategy: delete
            tls:
              enabled: true
        # Dedicated entrypoint for the CheckMK agent-receiver (TLS passthrough).
        # Internal port 8200 (8000 is already used by the 'web' entrypoint);
        # published on the default LoadBalancer (.231) as :8000 so agents can
        # register against checkmk.k8s.neese-web.de:8000.
        agentreceiver:
          port: 8200
          expose:
            default: true
          exposedPort: 8000
      image:
        pullPolicy: IfNotPresent
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
      priorityClassName: "system-cluster-critical"
      #nodeSelector:
      #  node-role.kubernetes.io/control-plane: "true"
      tolerations:
        - key: "CriticalAddonsOnly"
          operator: "Exists"
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
        - key: "node-role.kubernetes.io/master"
          operator: "Exists"
          effect: "NoSchedule"
      # Required so that traefik gets the correct ip address for the ingress objects
      # https://github.com/argoproj/argo-cd/issues/1704#issuecomment-904741817
      # https://doc.traefik.io/traefik/providers/kubernetes-ingress/#publishedservice
      providers:
        kubernetesIngress:
          publishedService:
            enabled: true
        kubernetesCRD:
          enabled: true
          allowCrossNamespace: true
        kubernetesGateway:
          enabled: true
      additionalArguments:
        - "--api=true"
        - "--api.insecure=true"
        - "--entryPoints.web.proxyProtocol.insecure"
        - "--entryPoints.web.forwardedHeaders.insecure"
        - "--entryPoints.web239.proxyProtocol.insecure"
        - "--entryPoints.web239.forwardedHeaders.insecure"
        #- "--accesslog=true"
      experimental:
        plugins:
          # Required for correct thruk redirect. Thruk sends in our scenario http redirect but we need to replace that with https
          redirectLocation:
            moduleName: "github.com/SchmitzDan/traefik-plugin-redirect-location"
            version: "v0.0.2"

generators:
  - kustomize-secret-generator.yaml
