---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: plugin-redirect-location
  namespace: traefik
spec:
  plugin:
    redirectLocation:
      default: "false"
      rewrites:
        - regex: "^http://(.+)$"
          replacement: "https://$1"
---
## Redirect from root to /admin/
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: root-to-admin
  namespace: traefik
spec:
  redirectRegex:
    regex: ^/$
    replacement: /admin/
    permanent: true
---
## Traefik http https redirect
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect
  namespace: traefik
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
## Block requests to traefik pilot
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: blockiframe
  namespace: traefik
spec:
  headers:
    customResponseHeaders:
      Content-Security-Policy: "frame-src none;"
---
## Remove a client-supplied Remote-User header. Attach it to every public route
## (no forward auth) whose backend trusts Remote-User from Traefik, e.g. apps
## with a reverse-proxy auth setting that trusts the pod CIDR. On routes with
## forward auth, Authelia already overwrites the header. Used by: Navidrome
## /share/ routes and the paperless-ngx /api Ingress, where a spoofed header
## yields a session for any user.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-remote-user
  namespace: traefik
spec:
  headers:
    customRequestHeaders:
      # An empty value removes the header.
      Remote-User: ""
---
## Cluster internal expose prometheus metrics
apiVersion: v1
kind: Service
metadata:
  name: traefik-metrics
  namespace: kube-system
  labels:
    app.kubernetes.io/instance: traefik
    app.kubernetes.io/name: traefik-metrics
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: 9100
      targetPort: metrics
      protocol: TCP
  selector:
    app.kubernetes.io/instance: traefik-kube-system
    app.kubernetes.io/name: traefik
---
## Traefik dashboard
apiVersion: v1
kind: Service
metadata:
  name: traefik-dashboard
  namespace: kube-system
  labels:
    app.kubernetes.io/instance: traefik
    app.kubernetes.io/name: traefik-dashboard
spec:
  type: ClusterIP
  ports:
    - name: traefik
      port: 9000
      targetPort: traefik
      protocol: TCP
  selector:
    app.kubernetes.io/instance: traefik-kube-system
    app.kubernetes.io/name: traefik
