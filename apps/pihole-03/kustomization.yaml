---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dns

helmGlobals:
  chartHome: ../../../pihole-kubernetes/charts
helmCharts:
  - name: pihole
    #repo: https://mojo2600.github.io/pihole-kubernetes/
    version: 2.35.0
    releaseName: pihole-03
    namespace: dns
    valuesFile: values.yaml

patches:
  - patch: |-
      - op: add
        path: /metadata/namespace
        value: dns
    target:
      kind: '.*'

#resources:
  #- k8s.np.pihole-03.yaml

commonAnnotations:
  argocd.argoproj.io/sync-wave: "13"
