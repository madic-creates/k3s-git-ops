nameOverride: pihole-03
image:
    repository: ghcr.io/pi-hole/pihole
    #tag: 2025.11.0
    pullPolicy: IfNotPresent
revisionHistoryLimit: 2
serviceDns:
    mixedService: true
    annotations:
        lbipam.cilium.io/ips: 192.168.1.238
    # type LoadBalancer with externalTrafficPolicy Local
    # requires 192.168.1.232 on the same node as the pod
    type: LoadBalancer
    #externalTrafficPolicy: Cluster
    #type: ClusterIP
serviceDhcp:
    enabled: false
virtualHost: ENC[AES256_GCM,data:5MQunhHinOSDNDI6QKubq5SoKZiMyecY2ZM95n67,iv:jcyqrvRas8bm7luNGEAy7Piy3hdYaVsLdHi7CIvv0Uk=,tag:c6M2sQaer4ReB3n+MaRX4A==,type:str]
ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
        - ENC[AES256_GCM,data:QgLBgj2l/Xd1qhGM0WnId31vxMuzUuJrdj8AuB0e,iv:ZJ9RVgTn6sc710HGwYcxlmC1ztIur2nFECTSzapWin4=,tag:AixwiXGGcx/1g56tcfZo9g==,type:str]
    tls:
        - secretName: wildcard-cloudflare-production-02
          hosts:
            - ENC[AES256_GCM,data:GDtOy8xfQW4TsMq6lXIJOjs9K0V5lgjzJqpc8WkK,iv:HzlfTQS/f97dtIOUsaIUsnrVWyWZegXmKYr0wr33MTQ=,tag:AwnwJxHc0bVG5s3TijQAMg==,type:str]
    annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: web239, websecure239
        traefik.ingress.kubernetes.io/router.tls: "true"
        traefik.ingress.kubernetes.io/router.middlewares: authelia-forwardauth-authelia@kubernetescrd, traefik-root-to-admin@kubernetescrd
resources:
    limits:
        cpu: "1"
        memory: 768Mi
    requests:
        cpu: 100m
        memory: 128Mi
extraEnvVars:
    TZ: Europe/Berlin
    # The node clock is set by the host. Setting it from a pod would need
    # SYS_TIME, which is not namespaced and would change the whole node.
    FTLCONF_ntp_sync_active: false
    FTLCONF_dns_bogusPriv: true
    FTLCONF_dns_domainNeeded: true
    FTLCONF_dns_domain_name: neese-web.de
    FTLCONF_webserver_interface_boxed: false
DNS1: 127.0.0.1:5053
DNS2: ""
# Not required because secured via authelia oidc
admin:
    enabled: false
doh:
    enabled: true
    config: ENC[AES256_GCM,data:,iv:ToM7SbqKwh5ecnYpKYX85PiOwQxDuo5x7dZrpcY2x7g=,tag:xdu1x+j2gGFklt6hi+5q0g==,type:str]
#podDnsConfig:
#    enabled: true
#    policy: None
#    nameservers:
#        - 1.1.1.1
#        - 127.0.0.1
capabilities:
    add:
        - NET_ADMIN
        - SYS_NICE
persistentVolumeClaim:
    enabled: true
    size: 1Gi
    # helm.sh/resource-policy: keep, ArgoCD then leaves the PVC on app deletion
    keep: true
    #existingClaim: pihole-02
dnsmasq:
    # Disabled entries are kept here as comments OUTSIDE customDnsEntries; do NOT
    # move them back as commented list items, as comments in an encrypted
    # sequence break the SOPS MAC. Disabled entries for reference:
    #   - 'address=/.neese-web.de/::'
    #   - 'address=/.k8s.neese-web.de/::'
    #   - 'address=/.internal.neese-web.de/::'
    #   - address=/youtubei.googleapis.com/216.239.38.119
    #   - address=/youtubei.googleapis.com/2001:4860:4802:32::77
    #   - address=/www.youtube.com/216.239.38.119
    #   - address=/www.youtube.com/2001:4860:4802:32::77
    #   - address=/m.youtube.com/216.239.38.119
    #   - address=/m.youtube.com/2001:4860:4802:32::77
    #   - address=/youtube.googleapis.com/216.239.38.119
    #   - address=/youtube.googleapis.com/2001:4860:4802:32::77
    #   - address=/www.youtube-nocookie.com/216.239.38.119
    #   - address=/www.youtube-nocookie.com/2001:4860:4802:32::77
    customDnsEntries:
        - ENC[AES256_GCM,data:VJRQx6a+6QqhTAWOQHOdS47H+jY3+MFwMpRBJF/Yhh86LD4=,iv:AqekDsFdilUXPXnDaZVfR8wh/OoQPExsXCAXYGWpq84=,tag:+Iifq8cV5/Xlbk09Z/djPg==,type:str]
        - ENC[AES256_GCM,data:no/uDGst7th7+B75S6rflJuVIob/i+B98w8LJLz6xpQFTzPNA2Q8IQ==,iv:YiHBGiI9LFpupjNnMH7fHPrUYf40y0QAautF6m7cSuE=,tag:+RDnNlR1N3sJmPX6aXnRqw==,type:str]
        - ENC[AES256_GCM,data:9/1x6dPBEqMLxoQVJcMirpB4rrRBURN4ZG1cLIvgiy0qPOkdD9ooJqB2hd9E,iv:9+KnmD6yaNcrqsrUKCY/bZci6zP2/GeoZt7sjl+0Hv0=,tag:nItsKozI2raCWy3QNMUT4A==,type:str]
    customSettings:
        - dhcp-option=252,"\n"
        - dhcp-option=vendor:MSFT,2,1i
        # DNS
        #- dhcp-option=6,192.168.1.232,192.168.1.1
        - dhcp-option=6,192.168.1.232
        # NTP
        - dhcp-option=42,192.168.1.1
        # Server-ID = relay address (dhcphelper node IP) instead of the pod IP,
        # so unicast renewals reach the relay instead of an unroutable pod IP
        - dhcp-proxy
        - dhcp-range=::,ra-names
        - server=/geekbundle.org/192.168.1.1
        - ptr-record=1.1.168.192.in-addr.arpa.,"despair"
        # TFTP Boot
        - dhcp-match=set:ipxe,175
        - dhcp-boot=tag:!ipxe,ipxe.pxe,dns01,192.168.1.45
        - dhcp-match=set:efi-x86_64,option:client-arch,7
        - dhcp-boot=tag:efi-x86_64,ipxe.efi,dns01,192.168.1.45
        - dhcp-boot=http://192.168.1.45:8043/boot.ipxe
        # DHCP Reservation with different dns server
        - dhcp-option=net:customdns,6,9.9.9.9,1.1.1.1
        - dhcp-host=net:customdns,EC:79:49:51:64:16,192.168.1.187,ipl06002-lan
        - dhcp-host=net:customdns,F4:4E:E3:2C:C2:B6,192.168.1.56,ipl06002-wlan
        # DHCP Reservation with unrestricted youtube dns server
        - dhcp-option=net:youtubedns,6,192.168.1.234
        - dhcp-host=net:youtubedns,AC:3E:B1:A6:AF:D6,Pixel-7-Pro
        - dhcp-host=net:youtubedns,E0:80:6B:37:56:83,Redmi-Note-11
        - dhcp-host=net:youtubedns,74:58:F3:E7:3A:04,Fire-Cube-lan
        - dhcp-host=net:youtubedns,48:43:DD:6E:CC:2D,Fire-Cube-wlan
        - dhcp-host=net:youtubedns,F0:27:2D:D7:41:97,Fire-Guest
        - dhcp-host=net:youtubedns,00:e0:4c:7b:c2:98,Sanctuary
        - dhcp-host=net:youtubedns,8c:8c:aa:32:ce:7a,IONB000201752-LAN
        - dhcp-host=net:youtubedns,4e:80:5d:ae:a9:dd,IONB000201752-WLAN
# Never on the same node as pihole-01 (release "pihole")
affinity:
    podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - pihole
              topologyKey: kubernetes.io/hostname
podSecurityContext:
    seccompProfile:
        type: RuntimeDefault
containerSecurityContext:
    privileged: false
    capabilities:
        add:
            - NET_ADMIN
            - SYS_NICE
# Reschedule faster on ungraceful node failure. Together with Longhorn's
# nodeDownPodDeletionPolicy this lets the pod move off a dead node instead of
# waiting for the default 300s unreachable/not-ready toleration.
tolerations:
    - key: node.kubernetes.io/unreachable
      operator: Exists
      effect: NoExecute
      tolerationSeconds: 30
    - key: node.kubernetes.io/not-ready
      operator: Exists
      effect: NoExecute
      tolerationSeconds: 30
# Pod hostname = Service name: Pi-hole accepts its own hostname as Host
# header without a password, so nebula-sync can use http://pihole-03-web
hostname: ENC[AES256_GCM,data:D07Tg25c8XJAmgHQdw==,iv:GZ4J2P6+4LEL70viLXLpzQUIO/Q7mHJEY+C57uZpCE0=,tag:t1/On9t8FdBm6rJYNdhn1w==,type:str]
networkPolicy:
    enabled: true
    ingress:
        # Web interface: only Traefik (ingress) and nebula-sync (config sync).
        # The API runs without a password (Authelia protects the UI), so no
        # other pod may reach it. DNS stays open (dnsFrom is empty).
        from:
            - namespaceSelector:
                matchLabels:
                    kubernetes.io/metadata.name: kube-system
              podSelector:
                matchLabels:
                    app.kubernetes.io/name: traefik
            - podSelector:
                matchLabels:
                    app: nebula-sync
        # Metrics ports (exporter sidecar): only Prometheus, without API access
        metricsFrom:
            - namespaceSelector:
                matchLabels:
                    kubernetes.io/metadata.name: monitoring
              podSelector:
                matchLabels:
                    app.kubernetes.io/name: prometheus
# Roll out only after pihole-01 (wave 0) is Healthy, see 12-pihole-helm
deploymentAnnotations:
    argocd.argoproj.io/sync-wave: "1"
# pihole-exporter sidecar (talks to Pi-hole via the pod IP, no password needed)
# and a PodMonitor; Prometheus egress to dns:9617 is in apps/monitoring
monitoring:
    sidecar:
        enabled: true
    podMonitor:
        enabled: true
        # The sidecar reports the pod IP as hostname; a stable name for the
        # pihole-exporter dashboard, which selects instances by hostname
        metricRelabelings:
            - sourceLabels:
                - __name__
              regex: pihole_.+
              targetLabel: hostname
              replacement: pihole-03
